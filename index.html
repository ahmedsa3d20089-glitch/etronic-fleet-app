function computePerFillConsumption(fuelRecords) {
  const byPlate = {};
  fuelRecords.forEach(r => {
    if (r.odometer) {
      if (!byPlate[r.plate]) byPlate[r.plate] = [];
      byPlate[r.plate].push(r);
    }
  });
  const rows = [];
  Object.entries(byPlate).forEach(([plate, list]) => {
    const s = [...list].sort((a, b) => (a.date || "").localeCompare(b.date || "") || Number(a.odometer) - Number(b.odometer));
    for (let i = 1; i < s.length; i++) {
      // آلية "تفويلة كاملة إلى تفويلة كاملة": المسافة = عداد التفويلة الحالية - عداد
      // التفويلة السابقة، والوقود المستهلك = لترات التفويلة الحالية فقط (وليس
      // السابقة أبدًا)، لأنها هي اللي عوّضت الاستهلاك بين آخر تفويلتين.
      const km = Number(s[i].odometer) - Number(s[i - 1].odometer);
      const liters = Number(s[i].liters || 0);
      const kmPerLiter = liters > 0 && km > 0 ? km / liters : 0;
      const literPer100km = km > 0 ? (liters * 100) / km : 0;
      rows.push({ plate, date: s[i].date, prevOdometer: Number(s[i - 1].odometer), odometer: Number(s[i].odometer), km, liters, kmPerLiter, literPer100km, driver: s[i].driver || "", cost: Number(s[i].cost || 0) });
    }
  });
  return rows.sort((a, b) => (b.date || "").localeCompare(a.date || ""));
}

// ============================================================
// طبقة حسابات الوقود (Clean Architecture) — منفصلة تمامًا عن
// الواجهة، عشان أي تعديل على معادلات الحساب مستقبلاً (حدود
// التنبيه، عدد أيام المتوسط المتحرك...) يبقى تغيير في مكان واحد
// بس من غير ما يلمس أي component.
// ============================================================

const FUEL_ANALYTICS_CONFIG = {
  rollingFillCount: 10,     // عدد آخر عمليات تموين للمتوسط المتحرك
  rollingDaysShort: 30,     // نافذة الـ30 يوم
  rollingDaysLong: 90,      // نافذة الـ90 يوم
  warningDeviationPct: 10,  // ±10% = تحذير
  criticalDeviationPct: 20, // ±20% = حرج
};

function averageOf(nums) {
  const valid = nums.filter(n => n > 0);
  if (valid.length === 0) return 0;
  return valid.reduce((sum, n) => sum + n, 0) / valid.length;
}

// بيرجع كل إحصائيات مركبة واحدة: الالاستهلاك الحالي، المتوسطات
// المتحركة (آخر 10 عمليات / 30 يوم / 90 يوم)، أفضل وأسوأ قراءة،
// ونسبة الانحراف عن المتوسط مع تصنيف التنبيه (طبيعي/تحذير/حرج)
function computeVehicleFuelAnalytics(plate, fuelRecords) {
  const rowsDesc = computePerFillConsumption(fuelRecords).filter(r => r.plate === plate);
  const rows = [...rowsDesc].reverse(); // من الأقدم للأحدث عشان نحسب "آخر N" صح

  if (rows.length === 0) {
    return { plate, rows: [], hasData: false, current: 0, avgLast10: 0, avgLast30Days: 0, avgLast90Days: 0, best: 0, worst: 0, deviationPct: 0, alertLevel: null };
  }

  const now = new Date();
  const cutoff = (days) => { const d = new Date(now); d.setDate(d.getDate() - days); return d; };
  const cutoff30 = cutoff(FUEL_ANALYTICS_CONFIG.rollingDaysShort);
  const cutoff90 = cutoff(FUEL_ANALYTICS_CONFIG.rollingDaysLong);

  const last10 = rows.slice(-FUEL_ANALYTICS_CONFIG.rollingFillCount);
  const last30Days = rows.filter(r => r.date && new Date(r.date) >= cutoff30);
  const last90Days = rows.filter(r => r.date && new Date(r.date) >= cutoff90);

  const current = rows[rows.length - 1].kmPerLiter;
  const avgLast10 = averageOf(last10.map(r => r.kmPerLiter));
  const avgLast30Days = averageOf(last30Days.map(r => r.kmPerLiter));
  const avgLast90Days = averageOf(last90Days.map(r => r.kmPerLiter));
  const allValid = rows.map(r => r.kmPerLiter).filter(n => n > 0);
  const best = allValid.length ? Math.max(...allValid) : 0;
  const worst = allValid.length ? Math.min(...allValid) : 0;

  // الانحراف بيتحسب مقابل أدق متوسط متاح (30 يوم، وإلا آخر 10 عمليات لو مفيش بيانات كفاية بالتاريخ)
  const baseline = avgLast30Days > 0 ? avgLast30Days : avgLast10;
  const deviationPct = baseline > 0 ? ((current - baseline) / baseline) * 100 : 0;
  let alertLevel = null;
  if (Math.abs(deviationPct) >= FUEL_ANALYTICS_CONFIG.criticalDeviationPct) alertLevel = "critical";
  else if (Math.abs(deviationPct) >= FUEL_ANALYTICS_CONFIG.warningDeviationPct) alertLevel = "warning";

  return { plate, rows, hasData: true, current, avgLast10, avgLast30Days, avgLast90Days, best, worst, deviationPct, alertLevel };
}

// بيرجع تحليل كل المركبات مرة واحدة، مرتب من الأسوأ انحراف للأحسن
function computeFleetFuelAnalytics(vehicles, fuelRecords) {
  return vehicles
    .map(v => computeVehicleFuelAnalytics(v.plate, fuelRecords))
    .filter(a => a.hasData)
    .sort((a, b) => Math.abs(b.deviationPct) - Math.abs(a.deviationPct));
}

const OIL_INTERVAL_KM = 2000;

// مصدر واحد موحَّد لحساب تنبيهات تغيير الزيت — يُستخدم في كل الشاشات
// (لوحة التحكم، الصيانة، الإشعارات) بدل تكرار المنطق في كل مكان على حدة،
// لضمان أن كل الشاشات تتفق دائمًا على نفس النتيجة.
// العداد الحالي = أعلى قراءة مسجَّلة لكل مركبة، من تبويب "قراءة العداد"
// المخصص أو من حقل العداد الإلزامي المُدخل مع كل عملية تعبئة وقود.
function computeOilAlerts(vehicles, odometerLogs, fuelRecords, maintenanceRecords) {
  const alerts = [];
  (vehicles || []).forEach(v => {
    const odoReadings = (odometerLogs || []).filter(l => l.plate === v.plate && l.odometer).map(l => Number(l.odometer));
    const fuelReadings = (fuelRecords || []).filter(f => f.plate === v.plate && f.odometer).map(f => Number(f.odometer));
    const allReadings = [...odoReadings, ...fuelReadings];
    if (allReadings.length === 0) return;
    const currentOdometer = Math.max(...allReadings);

    const oilChanges = (maintenanceRecords || []).filter(r => r.plate === v.plate && r.type === "تغيير الزيت" && r.odometer);
    const lastOilOdometer = oilChanges.length > 0 ? Math.max(...oilChanges.map(r => Number(r.odometer))) : 0;

    const kmSinceOil = currentOdometer - lastOilOdometer;
    if (kmSinceOil >= OIL_INTERVAL_KM) {
      alerts.push({ plate: v.plate, kmSinceOil, currentOdometer, lastOilOdometer });
    }
  });
  return alerts.sort((a, b) => b.kmSinceOil - a.kmSinceOil);
}

const FUEL_FLAG_LABELS = {
  SHORT_INTERVAL: { ar: "تعبئة أكثر من مرة في اليوم نفسه", en: "Refueled more than once the same day" },
  OVER_CAPACITY: { ar: "الكمية أكبر من سعة الخزان", en: "Quantity exceeds tank capacity" },
  ZERO_DISTANCE: { ar: "عملية تعبئة دون أي مسافة مقطوعة", en: "Refuel with zero distance driven" },
  LOW_DISTANCE_HIGH_FUEL: { ar: "مسافة قليلة جدًا مقابل كمية وقود كبيرة", en: "Very low distance for a large fuel amount" },
  ODOMETER_DECREASE: { ar: "قراءة العداد أقل من القراءة السابقة", en: "Odometer reading lower than the previous one" },
};

// نظام الـ Flags: بيدوّر على أنماط مختلفة من احتمالات التلاعب، كل واحد
// مستقل عن التاني، عشان لو حالة معينة معدل الاستهلاكها طلع طبيعي بالصدفة
// برضو تتمسك لو فيها علامة تلاعب تانية (زي كمية أكبر من التانك مثلاً)
function computeFuelFlags(vehicles, fuelRecords) {
  const vehicleByPlate = {};
  vehicles.forEach(v => { vehicleByPlate[v.plate] = v; });
  const flags = [];

  const dayGroups = {};
  fuelRecords.forEach(r => {
    if (!r.plate || !r.date) return;
    const key = r.plate + "|" + r.date;
    if (!dayGroups[key]) dayGroups[key] = [];
    dayGroups[key].push(r);
  });
  Object.entries(dayGroups).forEach(([key, list]) => {
    if (list.length > 1) {
      const [plate, date] = key.split("|");
      flags.push({ type: "SHORT_INTERVAL", severity: "warning", plate, date, detail: { ar: `${list.length} مرات`, en: `${list.length} times` } });
    }
  });

  computePerFillConsumption(fuelRecords).forEach(r => {
    const vehicle = vehicleByPlate[r.plate];
    if (vehicle && vehicle.tankCapacity && r.liters > Number(vehicle.tankCapacity)) {
      flags.push({ type: "OVER_CAPACITY", severity: "critical", plate: r.plate, date: r.date, detail: { ar: `${r.liters} لتر > ${vehicle.tankCapacity} لتر`, en: `${r.liters} L > ${vehicle.tankCapacity} L` } });
    }
    if (r.km < 0) {
      flags.push({ type: "ODOMETER_DECREASE", severity: "critical", plate: r.plate, date: r.date, detail: { ar: `${r.odometer} < ${r.prevOdometer}`, en: `${r.odometer} < ${r.prevOdometer}` } });
    } else if (r.km === 0 && r.liters > 0) {
      flags.push({ type: "ZERO_DISTANCE", severity: "warning", plate: r.plate, date: r.date, detail: { ar: `${r.liters} لتر`, en: `${r.liters} L` } });
    } else if (r.km > 0 && r.km < 5 && r.liters >= 5) {
      flags.push({ type: "LOW_DISTANCE_HIGH_FUEL", severity: "warning", plate: r.plate, date: r.date, detail: { ar: `${r.km} كم / ${r.liters} لتر`, en: `${r.km} km / ${r.liters} L` } });
    }
  });

  return flags.sort((a, b) => (b.date || "").localeCompare(a.date || ""));
}

// ============================================================
// Virtual Fuel Tank — محاكاة مستوى الوقود المتوقع في التانك
// ============================================================
// الفكرة: بدل ما نسأل "هل معدل الالاستهلاك ده طبيعي؟"، بنسأل "هل الكمية
// اللي اتحطت في التانك دلوقتي منطقية بناءً على اللي المفروض يكون متبقي
// فيه؟". بنحسب المستوى المتوقع بعد كل رحلة (المستوى السابق ناقص اللي
// اتصرف على المسافة المقطوعة حسب معدل المركبة التاريخي)، وبنقارنه
// بالمساحة الفاضية اللي اتملت فعليًا عند التعبئة الجاية.
// ده بيكشف حتى السرقة التدريجية البطيئة اللي مبتظهرش في حسابات كم/لتر
// العادية، لأنها بتبان كفرق متراكم بين المتوقع والفعلي.
// محتاج سعة التانك تكون متسجلة للمركبة عشان يشتغل.

const VIRTUAL_TANK_TOLERANCE_L = 5; // فرق مسموح بيه قبل ما نعتبره مشكلة

function computeVirtualTank(plate, vehicles, fuelRecords) {
  const vehicle = vehicles.find(v => v.plate === plate);
  const capacity = vehicle && vehicle.tankCapacity ? Number(vehicle.tankCapacity) : 0;
  if (!capacity) return { plate, hasCapacity: false, entries: [], discrepancies: [] };

  const analytics = computeVehicleFuelAnalytics(plate, fuelRecords);
  // بنستخدم متوسط المركبة التاريخي كأساس لتقدير الصرف على كل كيلومتر
  const baselineKmPerL = analytics.avgLast90Days > 0 ? analytics.avgLast90Days
    : analytics.avgLast10 > 0 ? analytics.avgLast10 : 0;
  if (!baselineKmPerL) return { plate, hasCapacity: true, hasBaseline: false, entries: [], discrepancies: [] };

  const fills = fuelRecords
    .filter(r => r.plate === plate && r.odometer)
    .sort((a, b) => (a.date || "").localeCompare(b.date || "") || Number(a.odometer) - Number(b.odometer));
  if (fills.length < 2) return { plate, hasCapacity: true, hasBaseline: true, entries: [], discrepancies: [] };

  const entries = [];
  const discrepancies = [];
  // بنفترض إن أول تعبئة ملت التانك (نقطة بداية معقولة للمحاكاة)
  let levelAfterFill = capacity;

  for (let i = 1; i < fills.length; i++) {
    const km = Number(fills[i].odometer) - Number(fills[i - 1].odometer);
    const litersAdded = Number(fills[i].liters || 0);
    if (km < 0) { levelAfterFill = capacity; continue; }

    const expectedBurned = km / baselineKmPerL;
    const expectedLevelBefore = Math.max(0, levelAfterFill - expectedBurned);
    // المساحة الفاضية المتوقعة في التانك عند التعبئة دي
    const expectedSpace = capacity - expectedLevelBefore;
    // لو اتحط وقود أكتر من المساحة المتوقعة، يبقى التانك كان أفضى من
    // المفروض = وقود اختفى من غير ما يتصرف على مسافة
    const gap = litersAdded - expectedSpace;

    const entry = {
      date: fills[i].date,
      km,
      litersAdded,
      expectedBurned,
      expectedLevelBefore,
      expectedSpace,
      gap,
      driver: fills[i].driver || "",
    };
    entries.push(entry);
    if (gap > VIRTUAL_TANK_TOLERANCE_L) discrepancies.push(entry);

    levelAfterFill = Math.min(capacity, expectedLevelBefore + litersAdded);
  }

  const totalGap = discrepancies.reduce((sum, e) => sum + e.gap, 0);
  return { plate, hasCapacity: true, hasBaseline: true, capacity, baselineKmPerL, entries: entries.reverse(), discrepancies, totalGap };
}

function computeFleetVirtualTanks(vehicles, fuelRecords) {
  return vehicles
    .map(v => computeVirtualTank(v.plate, vehicles, fuelRecords))
    .filter(t => t.hasCapacity && t.hasBaseline && t.discrepancies.length > 0)
    .sort((a, b) => b.totalGap - a.totalGap);
}

// ============================================================
// محرك الشرح الذكي — بيقترح أسباب محتملة لكل تنبيه بدل ما يعرض
// التنبيه لوحده من غير تفسير
// ============================================================
// ============================================================
// إحصائيات تفصيلية لكل مركبة + مقارنة شهر بشهر
// ============================================================
function monthKeyOf(dateStr) {
  return (dateStr || "").slice(0, 7); // YYYY-MM
}

function computeVehicleStats(plate, fuelRecords, odometerLogs, deliveries) {
  const analytics = computeVehicleFuelAnalytics(plate, fuelRecords);
  const fills = (fuelRecords || []).filter(r => r.plate === plate);

  const now = new Date();
  const thisMonth = now.toISOString().slice(0, 7);
  const prev = new Date(now.getFullYear(), now.getMonth() - 1, 1);
  const prevMonth = prev.toISOString().slice(0, 7);

  const monthFills = fills.filter(r => monthKeyOf(r.date) === thisMonth);
  const monthlyFuelUsed = monthFills.reduce((s, r) => s + (Number(r.liters) || 0), 0);
  const monthlyCost = monthFills.reduce((s, r) => s + (Number(r.cost) || 0), 0);
  const totalCost = fills.reduce((s, r) => s + (Number(r.cost) || 0), 0);

  // المسافة الشهرية من قراءات العداد (أدق من الاعتماد على التعبئات وحدها)
  const monthLogs = (odometerLogs || [])
    .filter(l => l.plate === plate && monthKeyOf(l.date) === thisMonth && l.odometer)
    .map(l => Number(l.odometer));
  const monthlyDistance = monthLogs.length > 1 ? Math.max(...monthLogs) - Math.min(...monthLogs) : 0;

  const totalDistance = analytics.rows.reduce((s, r) => s + (r.km > 0 ? r.km : 0), 0);
  const costPerKm = totalDistance > 0 ? totalCost / totalDistance : 0;

  const deliveryCount = (deliveries || []).filter(d => d.status === "تم التسليم").length;
  const costPerDelivery = deliveryCount > 0 ? totalCost / deliveryCount : 0;

  // المتوسط اليومي على مدار الشهر الحالي
  const daysElapsed = now.getDate();
  const avgDailyDistance = daysElapsed > 0 ? monthlyDistance / daysElapsed : 0;
  const avgDailyFuel = daysElapsed > 0 ? monthlyFuelUsed / daysElapsed : 0;

  // مقارنة الشهر الحالي بالشهر اللي فاته في معدل الالاستهلاك
  const avgOfMonth = (mk) => {
    const rows = analytics.rows.filter(r => monthKeyOf(r.date) === mk && r.kmPerLiter > 0);
    return averageOf(rows.map(r => r.kmPerLiter));
  };
  const thisMonthAvg = avgOfMonth(thisMonth);
  const prevMonthAvg = avgOfMonth(prevMonth);
  const monthOverMonthPct = prevMonthAvg > 0 ? ((thisMonthAvg - prevMonthAvg) / prevMonthAvg) * 100 : null;

  return {
    plate,
    hasData: analytics.hasData,
    current: analytics.current,
    average: analytics.avgLast90Days > 0 ? analytics.avgLast90Days : analytics.avgLast10,
    best: analytics.best,
    worst: analytics.worst,
    alertLevel: analytics.alertLevel,
    deviationPct: analytics.deviationPct,
    monthlyFuelUsed,
    monthlyDistance,
    monthlyCost,
    totalCost,
    costPerKm,
    costPerDelivery,
    totalRefuels: fills.length,
    avgDailyDistance,
    avgDailyFuel,
    thisMonthAvg,
    prevMonthAvg,
    monthOverMonthPct,
  };
}

function computeFleetStats(vehicles, fuelRecords, odometerLogs, deliveries) {
  return (vehicles || [])
    .map(v => computeVehicleStats(v.plate, fuelRecords, odometerLogs, deliveries))
    .filter(s => s.hasData);
}

function explainFuelAlert(analytics, lang) {
  const t = (ar, en) => (lang === "en" ? en : ar);
  const reasons = [];
  if (!analytics || !analytics.alertLevel) return reasons;

  if (analytics.deviationPct < 0) {
    // الاستهلاك أسوأ من المعتاد (كيلومترات أقل على نفس الوقود)
    reasons.push(t("احتمال سرقة أو تسريب وقود", "Possible fuel theft or leak"));
    reasons.push(t("زيادة في الحمولة عن المعتاد", "Heavier load than usual"));
    reasons.push(t("ازدحام مروري أو توقف طويل مع بقاء المحرك يعمل", "Traffic congestion or long idling with the engine running"));
    reasons.push(t("احتياج إلى صيانة (فلاتر، إطارات، ضبط محرك)", "Maintenance needed (filters, tires, engine tuning)"));
  } else {
    // الاستهلاك أفضل بشكل غير طبيعي — غالبًا مشكلة في البيانات مش في الأداء
    reasons.push(t("خطأ في قراءة العداد (رقم أكبر من الحقيقي)", "Odometer misreading (entered higher than actual)"));
    reasons.push(t("عملية تعبئة مسجَّلة بكمية أقل من الفعلي", "Fill-up logged with less fuel than actually added"));
    reasons.push(t("عملية تعبئة سابقة غير مسجَّلة في النظام", "A previous fill-up is missing from the system"));
  }
  return reasons;
}

function ReportsTab({ fuelRecords, odometerLogs, vehicles, deliveries, lang }) {
  const tr = (ar, en) => (lang === "en" ? en : ar);
  const [fuelFrom, setFuelFrom] = useState("");
  const [fuelTo, setFuelTo] = useState("");
  const [fuelPlate, setFuelPlate] = useState("");
  const [kmFrom, setKmFrom] = useState("");   // فلتر التاريخ "من" لتقرير الكيلومترات اليومية
  const [kmTo, setKmTo] = useState("");       // فلتر التاريخ "إلى"
  const [kmMin, setKmMin] = useState("");     // فلتر الكيلومترات الفعلي — حد أدنى
  const [kmMax, setKmMax] = useState("");     // فلتر الكيلومترات الفعلي — حد أقصى
  const [anFrom, setAnFrom] = useState("");
  const [anTo, setAnTo] = useState("");
  const [anPlate, setAnPlate] = useState("");

  // فلترة سجلات الوقود الأول، وبعدين نمرر النتيجة لكل محركات التحليل
  // عشان كل التقارير الجديدة (المتوسطات، الـFlags، التانك الافتراضي)
  // تحترم نفس الفلتر تلقائيًا
  const analyticsRecords = useMemo(() => fuelRecords.filter(r =>
    (!anFrom || (r.date || "") >= anFrom) && (!anTo || (r.date || "") <= anTo) && (!anPlate || r.plate === anPlate)
  ), [fuelRecords, anFrom, anTo, anPlate]);
  const analyticsVehicles = useMemo(() => anPlate ? vehicles.filter(v => v.plate === anPlate) : vehicles, [vehicles, anPlate]);

  const fleetAnalytics = useMemo(() => computeFleetFuelAnalytics(analyticsVehicles, analyticsRecords), [analyticsVehicles, analyticsRecords]);
  const fuelFlags = useMemo(() => computeFuelFlags(analyticsVehicles, analyticsRecords), [analyticsVehicles, analyticsRecords]);
  const virtualTanks = useMemo(() => computeFleetVirtualTanks(analyticsVehicles, analyticsRecords), [analyticsVehicles, analyticsRecords]);
  const fleetStats = useMemo(() => computeFleetStats(analyticsVehicles, analyticsRecords, odometerLogs, deliveries), [analyticsVehicles, analyticsRecords, odometerLogs, deliveries]);
  const bestRanked = useMemo(() => [...fleetStats].filter(s => s.average > 0).sort((a, b) => b.average - a.average), [fleetStats]);
  const needsReview = useMemo(() => fleetStats.filter(s => s.alertLevel), [fleetStats]);
  const allPlateOptions = useMemo(() =>
    [...new Set(vehicles.map(v => v.plate).filter(Boolean))].sort((a, b) => a.localeCompare(b)),
    [vehicles]);
  // خريطة المعدل الطبيعي لكل مركبة، عشان نحكم على كل تعبئة لوحدها
  // بمقارنتها بمتوسط سيارتها هي — مش برقم ثابت لكل الأسطول
  const baselineByPlate = useMemo(() => {
    const map = {};
    computeFleetFuelAnalytics(vehicles, fuelRecords).forEach(a => {
      map[a.plate] = a.avgLast90Days > 0 ? a.avgLast90Days : a.avgLast10;
    });
    return map;
  }, [vehicles, fuelRecords]);
  function isFillSuspicious(r) {
    const baseline = baselineByPlate[r.plate];
    if (!baseline || !(r.kmPerLiter > 0)) return false;
    const dev = ((r.kmPerLiter - baseline) / baseline) * 100;
    return dev <= -FUEL_ANALYTICS_CONFIG.criticalDeviationPct;
  }

  const perFillAll = useMemo(() => computePerFillConsumption(fuelRecords), [fuelRecords]);
  const plateOptions = useMemo(() =>
    [...new Set(perFillAll.map(r => r.plate).filter(Boolean))].sort((a, b) => a.localeCompare(b)),
    [perFillAll]);
  const perFill = useMemo(() => perFillAll.filter(r =>
    (!fuelFrom || r.date >= fuelFrom) && (!fuelTo || r.date <= fuelTo) && (!fuelPlate || r.plate === fuelPlate)
  ), [perFillAll, fuelFrom, fuelTo, fuelPlate]);
  const dailyByPlateAll = useMemo(() => {
    const byPlate = {};
    odometerLogs.forEach(l => {
      if (!byPlate[l.plate]) byPlate[l.plate] = [];
      byPlate[l.plate].push(l);
    });
    const rows = [];
    Object.entries(byPlate).forEach(([plate, list]) => {
      const s = [...list].sort((a, b) => (a.date || "").localeCompare(b.date || ""));
      for (let i = 1; i < s.length; i++) {
        const days = (new Date(s[i].date) - new Date(s[i - 1].date)) / 86400000;
        const km = Number(s[i].odometer) - Number(s[i - 1].odometer);
        if (days > 0 && km >= 0) {
          rows.push({ plate, from: s[i - 1].date, to: s[i].date, km, avgPerDay: km / days });
        }
      }
    });
    return rows.sort((a, b) => b.to.localeCompare(a.to));
  }, [odometerLogs]);

  const dailyByPlate = useMemo(() => dailyByPlateAll.filter(r => {
    const inDateRange = (!kmFrom || r.to >= kmFrom) && (!kmTo || r.from <= kmTo);
    const min = kmMin !== "" ? Number(kmMin) : null;
    const max = kmMax !== "" ? Number(kmMax) : null;
    const inKmRange = (min === null || r.km >= min) && (max === null || r.km <= max);
    return inDateRange && inKmRange;
  }), [dailyByPlateAll, kmFrom, kmTo, kmMin, kmMax]);
  function exportStatsXlsx() {
    const headers = tr(["المركبة", "الحالي كم/لتر", "المتوسط", "أفضل", "أسوأ", "وقود الشهر لتر", "مسافة الشهر كم", "تكلفة الشهر", "إجمالي التكلفة", "تكلفة/كم", "تكلفة/توصيلة", "عدد التعبئات", "المتوسط اليومي كم", "المتوسط اليومي لتر", "مقارنة بالشهر السابق %"],
      ["Vehicle", "Current km/L", "Average", "Best", "Worst", "Monthly fuel L", "Monthly distance km", "Monthly cost", "Total cost", "Cost/km", "Cost/delivery", "Total refuels", "Avg daily km", "Avg daily L", "Month-over-month %"]);
    const rows = fleetStats.map(s => [
      s.plate, round2(s.current), round2(s.average), round2(s.best), round2(s.worst),
      round1(s.monthlyFuelUsed), Math.round(s.monthlyDistance), round2(s.monthlyCost), round2(s.totalCost),
      round2(s.costPerKm), round2(s.costPerDelivery), s.totalRefuels,
      round1(s.avgDailyDistance), round2(s.avgDailyFuel),
      s.monthOverMonthPct === null ? "" : round1(s.monthOverMonthPct),
    ]);
    exportTableToXlsx(tr("إحصائيات المركبات", "Vehicle Statistics"), headers, rows, tr("تقرير_إحصائيات_المركبات.xlsx", "vehicle_stats_report.xlsx"));
  }
  function exportStatsPdf() {

      fleetStats.map(s => [s.plate, s.average.toFixed(2), s.monthlyFuelUsed.toFixed(1), s.monthlyDistance.toFixed(0), s.monthlyCost.toFixed(0), s.costPerKm.toFixed(2), s.costPerDelivery.toFixed(2), s.totalRefuels]),
      tr("تقرير_إحصائيات_المركبات.pdf", "vehicle_stats_report.pdf")
    );
  }

  function exportAnalyticsXlsx() {
    const headers = tr(["المركبة", "الحالي كم/لتر", "متوسط آخر 10", "متوسط 30 يوم", "متوسط 90 يوم", "أفضل", "أسوأ", "الانحراف %", "الحالة", "أسباب محتملة"],
      ["Vehicle", "Current km/L", "Avg last 10", "Avg 30d", "Avg 90d", "Best", "Worst", "Deviation %", "Status", "Possible causes"]);

    const rows = fleetAnalytics.map(a => [

    exportTableToXlsx(tr("المتوسطات والانحراف", "Averages & Deviation"), headers, rows, tr("تقرير_المتوسطات_والانحراف.xlsx", "averages_deviation_report.xlsx"));

      fleetAnalytics.map(a => [a.plate, a.current.toFixed(2), a.avgLast10.toFixed(2), a.avgLast30Days.toFixed(2), a.avgLast90Days.toFixed(2), `${a.best.toFixed(1)}/${a.worst.toFixed(1)}`, a.deviationPct.toFixed(1), statusText(a.alertLevel)]),

function DeliveryReportsTab({ deliveries, setDeliveries, isAdmin, lang }) {
  const tr = (ar, en) => (lang === "en" ? en : ar);
  const [q, setQ] = useState("");
  const [repFilter, setRepFilter] = useState("");
  const [statusFilter, setStatusFilter] = useState("");
  const [dateFrom, setDateFrom] = useState("");
  const [dateTo, setDateTo] = useState("");
  const [page, setPage] = useState(1);
  const [viewPhoto, setViewPhoto] = useState(null);

  function removeDelivery(id) {
    if (!confirm(tr("هل أنت متأكد من حذف سجل التسليم هذا؟ هذا الإجراء نهائي.", "Are you sure you want to delete this delivery record? This cannot be undone."))) return;
    setDeliveries((deliveries || []).filter(d => d.id !== id));
  }

  const repOptions = useMemo(() =>
    [...new Set((deliveries || []).map(d => d.repName || d.enteredBy).filter(Boolean))].sort((a, b) => a.localeCompare(b)),
    [deliveries]);

  const filtered = useMemo(() => (deliveries || []).filter(d => {
    const dateOnly = d.date || (d.deliveredAt || "").slice(0, 10);
    return (!q || (d.customerName || "").toLowerCase().includes(q.toLowerCase()) || String(d.customerCode || "").includes(q))
      && (!repFilter || (d.repName || d.enteredBy) === repFilter)
      && (!statusFilter || d.status === statusFilter)
      && (!dateFrom || dateOnly >= dateFrom)
      && (!dateTo || dateOnly <= dateTo);
  }).sort((a, b) => (b.deliveredAt || "").localeCompare(a.deliveredAt || "")), [deliveries, q, repFilter, statusFilter, dateFrom, dateTo]);

  const paged = filtered.slice((page - 1) * PAGE_SIZE, page * PAGE_SIZE);
  const deliveredCount = filtered.filter(d => d.status === "تم التسليم").length;
  const notDeliveredCount = filtered.filter(d => d.status === "لم يتم التسليم").length;

  function exportXlsx() {
    const headers = tr(["التاريخ", "الوقت", "العميل", "الكود", "الحالة", "المستلم", "المندوب", "ملاحظات"], ["Date", "Time", "Customer", "Code", "Status", "Recipient", "Rep", "Notes"]);
    const rows = filtered.map(d => {
      const statusText = d.status === "تم التسليم" ? tr("تم التسليم", "Delivered") : tr("لم يتم التسليم", "Not delivered");
      return [d.date || (d.deliveredAt || "").slice(0, 10), (d.deliveredAt || "").replace("T", " ").slice(11, 16), d.customerName || "", d.customerCode || "", statusText, d.recipientName || "", d.repName || d.enteredBy || "", d.notes || ""];
    });
    exportTableToXlsx(tr("تقرير التسليمات", "Delivery Report"), headers, rows, tr("تقرير_التسليمات.xlsx", "delivery_report.xlsx"));
  }
  function exportPdf() {
    exportTableToPdf(
      tr("تقرير التسليمات", "Delivery report"),
      tr(["التاريخ والوقت", "العميل", "الحالة", "المستلم", "المندوب", "ملاحظات"], ["Date & time", "Customer", "Status", "Recipient", "Rep", "Notes"]),
      filtered.map(d => [
        (d.deliveredAt || "").replace("T", " ").slice(0, 16),
        d.customerName || "",
        d.status === "تم التسليم" ? tr("تم التسليم", "Delivered") : tr("لم يتم التسليم", "Not delivered"),
        d.recipientName || "",
        d.repName || d.enteredBy || "",
        d.notes || "",
      ]),
      tr("تقرير_التسليمات.pdf", "delivery_report.pdf")
    );
  }

  return (
    <div>
      <h2 className="font-ui font-extrabold text-xl mb-1" style={{ color: C.text }}>{tr("تقارير التسليمات", "Delivery Reports")}</h2>
      <p className="font-ui text-xs mb-5" style={{ color: C.muted }}>{tr("سجل كل عمليات التسليم المسجَّلة من تبويب خط السير", "Log of all deliveries recorded from the Route tab")}</p>

      <div className="flex flex-wrap gap-3 mb-6">
        <KpiCard icon={Package} value={filtered.length} label={tr("إجمالي السجلات", "Total records")} color={C.teal} />
        <KpiCard icon={CheckCircle} value={deliveredCount} label={tr("تم التسليم", "Delivered")} color={C.teal} />
        <KpiCard icon={XCircle} value={notDeliveredCount} label={tr("لم يتم التسليم", "Not delivered")} color={C.red} />
      </div>

      <div className="rounded-2xl p-4 mb-6" style={{ background: C.surface, border: `1px solid ${C.border}` }}>
        <div className="flex items-center justify-between mb-3 flex-wrap gap-2">
          <h3 className="font-ui font-bold text-sm" style={{ color: C.text }}>{tr("فلترة وبحث", "Search & filter")}</h3>
          <div className="flex items-center gap-2">
            <button onClick={exportXlsx} disabled={!filtered.length} className="px-2.5 py-1.5 rounded-lg font-ui text-[11px] font-semibold disabled:opacity-40" style={{ background: `${C.teal}22`, color: C.teal }}>⬇ Excel (.xlsx)</button>
            <button onClick={exportPdf} disabled={!filtered.length} className="px-2.5 py-1.5 rounded-lg font-ui text-[11px] font-semibold disabled:opacity-40" style={{ background: `${C.red}18`, color: C.red }}>⬇ PDF</button>
          </div>
        </div>
        <SearchBox value={q} onChange={(v) => { setQ(v); setPage(1); }} placeholder={tr("ابحث باسم العميل أو الكود...", "Search by customer name or code...")} />
        <div className="flex items-center gap-2 flex-wrap">
          <input type="date" value={dateFrom} onChange={e => { setDateFrom(e.target.value); setPage(1); }} placeholder={tr("من تاريخ", "From")}
            className="flex-1 rounded-lg px-2 py-2 font-ui text-xs outline-none" style={{ background: C.surface2, border: `1px solid ${C.border}`, color: C.text }} />
          <input type="date" value={dateTo} onChange={e => { setDateTo(e.target.value); setPage(1); }} placeholder={tr("إلى تاريخ", "To")}
            className="flex-1 rounded-lg px-2 py-2 font-ui text-xs outline-none" style={{ background: C.surface2, border: `1px solid ${C.border}`, color: C.text }} />
          <select value={repFilter} onChange={e => { setRepFilter(e.target.value); setPage(1); }}
            className="rounded-lg px-2 py-2 font-ui text-xs outline-none" style={{ background: C.surface2, border: `1px solid ${C.border}`, color: C.text }}>
            <option value="">{tr("كل المناديب", "All reps")}</option>
            {repOptions.map(r => <option key={r} value={r}>{r}</option>)}
          </select>
          <select value={statusFilter} onChange={e => { setStatusFilter(e.target.value); setPage(1); }}
            className="rounded-lg px-2 py-2 font-ui text-xs outline-none" style={{ background: C.surface2, border: `1px solid ${C.border}`, color: C.text }}>
            <option value="">{tr("كل الحالات", "All statuses")}</option>
            <option value="تم التسليم">{tr("تم التسليم", "Delivered")}</option>
            <option value="لم يتم التسليم">{tr("لم يتم التسليم", "Not delivered")}</option>
          </select>
        </div>
      </div>

      {filtered.length === 0 ? (
        <EmptyState text={tr("لا توجد عمليات تسليم مسجَّلة تطابق هذا الفلتر.", "No delivery records match this filter yet.")} />
      ) : (
        <>
          <div className="space-y-2">
            {paged.map(d => (
              <div key={d.id} className="flex items-center gap-3 rounded-xl p-3" style={{ background: C.surface, border: `1px solid ${C.border}` }}>
                <div className="w-9 h-9 rounded-full flex items-center justify-center shrink-0" style={{ background: d.status === "تم التسليم" ? `${C.teal}22` : `${C.red}18` }}>
                  {d.status === "تم التسليم" ? <CheckCircle size={14} color={C.teal} /> : <XCircle size={14} color={C.red} />}
                </div>
                <div className="flex-1 min-w-0">
                  <p className="font-ui font-semibold text-sm truncate" style={{ color: C.text }}>{d.customerName || tr("بدون اسم", "No name")}</p>
                  <p className="font-ui text-xs truncate" style={{ color: C.muted }}>
                    {(d.deliveredAt || "").replace("T", " ").slice(0, 16)}
                    {d.recipientName ? ` · ${tr("المستلم", "Recipient")}: ${d.recipientName}` : ""}
                    {(d.repName || d.enteredBy) ? ` · ${tr("المندوب", "Rep")}: ${d.repName || d.enteredBy}` : ""}
                    {d.notes ? ` · ${d.notes}` : ""}
                  </p>
                </div>
                {d.photo && <PhotoThumb src={d.photo} alt={tr("إثبات تسليم", "delivery proof")} onView={setViewPhoto} />}
                <span className="font-ui text-[11px] font-bold shrink-0 px-2.5 py-1 rounded-full"
                  style={{ background: d.status === "تم التسليم" ? `${C.teal}22` : `${C.red}18`, color: d.status === "تم التسليم" ? C.teal : C.red }}>
                  {d.status === "تم التسليم" ? "✅ " + tr("تم التسليم", "Delivered") : "❌ " + tr("لم يتم التسليم", "Not delivered")}
                </span>
                {isAdmin && (
                  <button onClick={() => removeDelivery(d.id)} className="p-1.5 rounded-lg shrink-0" style={{ background: `${C.red}18` }}>
                    <Trash2 size={13} color={C.red} />
                  </button>
                )}
              </div>
            ))}
          </div>
          <Pager page={page} setPage={setPage} total={filtered.length} />
        </>
      )}

      <PhotoLightbox photo={viewPhoto} onClose={() => setViewPhoto(null)} alt={tr("إثبات تسليم", "delivery proof")} />
    </div>
  );
}


function SettingsTab({ currentUser, lang, setLang, theme, setTheme, notifPermission, requestNotifPermission }) {

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.getRegistrations().then(regs => {
        regs.forEach(r => r.unregister());
        window.location.reload(true);
      });
    } else {
      window.location.reload(true);
    }

  return (
    <div>
      <h2 className="font-ui font-extrabold text-xl mb-4" style={{ color: C.text }}>{lang === "en" ? "Settings" : "الإعدادات"}</h2>

        <p className="font-ui text-xs" style={{ color: C.muted }}>

      <div className="rounded-2xl p-4 mb-4" style={{ background: C.surface, border: `1px solid ${C.border}` }}>
        <h3 className="font-ui font-bold text-sm mb-3" style={{ color: C.text }}>
          {lang === "en" ? "Language" : "اللغة"}

            className="px-4 py-2 rounded-lg font-ui text-sm font-semibold"
            style={{ background: lang === "ar" ? `${C.teal}22` : C.surface2, color: lang === "ar" ? C.teal : C.muted, border: `1px solid ${lang === "ar" ? C.teal : C.border}` }}>

          <button onClick={() => setLang("en")}

// ============================================================
// تقارير عامة — تجميع بيانات خط السير + الوقود + الصيانة لكل مركبة
// في فترة زمنية واحدة، لإعطاء صورة تشغيلية شاملة بدل ما تكون
// البيانات متفرقة بين تبويبات منفصلة.
// ============================================================
function GeneralReportsTab({ vehicles, fuelRecords, maintenanceRecords, deliveries, employees, lang }) {
  const tr = (ar, en) => (lang === "en" ? en : ar);
  const MAINT_TYPE_LABELS = {
    "صيانة دورية": { ar: "صيانة دورية", en: "Routine maintenance" },
    "إصلاح عطل": { ar: "إصلاح عطل", en: "Repair" },
    "تغيير الزيت": { ar: "تغيير الزيت", en: "Oil change" },
    "إطارات": { ar: "إطارات", en: "Tires" },
    "أخرى": { ar: "أخرى", en: "Other" },
  };
  const [dateFrom, setDateFrom] = useState("");
  const [dateTo, setDateTo] = useState("");
  const [plateFilter, setPlateFilter] = useState("");
  const [repFilter, setRepFilter] = useState("");

  const inRange = (date) => (!dateFrom || (date || "") >= dateFrom) && (!dateTo || (date || "") <= dateTo);

  const filteredDeliveries = useMemo(() =>
    (deliveries || []).filter(d =>
      inRange(d.date || (d.deliveredAt || "").slice(0, 10)) &&
      (!plateFilter || d.plate === plateFilter) &&
      (!repFilter || String(d.repCode) === String(repFilter))
    ),
    [deliveries, dateFrom, dateTo, plateFilter, repFilter]);

  const perFillAll = useMemo(() => computePerFillConsumption(fuelRecords || []), [fuelRecords]);

  const perVehicle = useMemo(() => {
    return (vehicles || [])
      .filter(v => !plateFilter || v.plate === plateFilter)
      .map(v => {
        const stops = filteredDeliveries.filter(d => d.plate === v.plate);
        // رحلة واحدة = مندوب واحد + مركبة واحدة + يوم واحد، بغض النظر عن عدد
        // العملاء اللي اتزاروا في نفس اليوم — مش رحلة لكل عميل على حدة.
        const uniqueTrips = new Set(stops.map(d => `${d.repCode}__${d.date || (d.deliveredAt || "").slice(0, 10)}`));
        const deliveredCount = stops.filter(d => d.status === "تم التسليم").length;
        const undeliveredCount = stops.filter(d => d.status === "لم يتم التسليم").length;
        const fills = perFillAll.filter(r => r.plate === v.plate && inRange(r.date));
        const maint = (maintenanceRecords || []).filter(r => r.plate === v.plate && inRange(r.date));

        const totalDistance = fills.reduce((s, r) => s + Math.max(0, r.km), 0);
        const totalLiters = fills.reduce((s, r) => s + r.liters, 0);
        const fuelCost = fills.reduce((s, r) => s + r.cost, 0);
        const kmPerLiter = totalLiters > 0 ? totalDistance / totalLiters : 0;
        const literPer100km = totalDistance > 0 ? (totalLiters * 100) / totalDistance : 0;

        const maintenanceCost = maint.reduce((s, r) => s + Number(r.cost || 0), 0);
        const maintenanceByType = {};
        maint.forEach(r => {
          const label = MAINT_TYPE_LABELS[r.type] ? tr(MAINT_TYPE_LABELS[r.type].ar, MAINT_TYPE_LABELS[r.type].en) : r.type;
          maintenanceByType[label] = (maintenanceByType[label] || 0) + Number(r.cost || 0);
        });
        const maintenanceTypesSummary = Object.entries(maintenanceByType)
          .map(([type, cost]) => `${type} (${cost.toFixed(0)})`)
          .join("، ");

        const totalOperationalCost = fuelCost + maintenanceCost;
        const costPerKm = totalDistance > 0 ? totalOperationalCost / totalDistance : 0;

        return {
          plate: v.plate,
          tripsCount: uniqueTrips.size,
          deliveredCount, undeliveredCount,
          totalDistance, totalLiters, kmPerLiter, literPer100km,
          fuelCost, maintenanceCost, maintenanceTypesSummary,
          totalOperationalCost, costPerKm,
        };
      });
  }, [vehicles, filteredDeliveries, perFillAll, maintenanceRecords, plateFilter, dateFrom, dateTo]);

  const totals = useMemo(() => perVehicle.reduce((acc, r) => ({
    trips: acc.trips + r.tripsCount,
    delivered: acc.delivered + r.deliveredCount,
    undelivered: acc.undelivered + r.undeliveredCount,
    distance: acc.distance + r.totalDistance,
    liters: acc.liters + r.totalLiters,
    fuelCost: acc.fuelCost + r.fuelCost,
    maintenanceCost: acc.maintenanceCost + r.maintenanceCost,
    operationalCost: acc.operationalCost + r.totalOperationalCost,
  }), { trips: 0, delivered: 0, undelivered: 0, distance: 0, liters: 0, fuelCost: 0, maintenanceCost: 0, operationalCost: 0 }), [perVehicle]);

  function exportXlsx() {
    const headers = tr(
      ["المركبة", "عدد الرحلات", "عملاء تم التسليم", "عملاء لم يتم التسليم", "إجمالي المسافة (كم)", "إجمالي اللترات", "كم/لتر", "لتر/100كم", "تكلفة الوقود", "تكلفة الصيانة", "أنواع الصيانة", "إجمالي تكلفة التشغيل", "تكلفة/كم"],
      ["Vehicle", "Trips", "Delivered", "Undelivered", "Total distance (km)", "Total liters", "Km/L", "L/100km", "Fuel cost", "Maintenance cost", "Maintenance types", "Total operational cost", "Cost/km"]
    );
    const rows = perVehicle.map(r => [
      r.plate, r.tripsCount, r.deliveredCount, r.undeliveredCount, round1(r.totalDistance), round1(r.totalLiters), round2(r.kmPerLiter), round2(r.literPer100km),
      round1(r.fuelCost), round1(r.maintenanceCost), r.maintenanceTypesSummary || "—", round1(r.totalOperationalCost), round2(r.costPerKm),
    ]);
    exportTableToXlsx(tr("التقارير العامة", "General Reports"), headers, rows, tr("التقارير_العامة.xlsx", "general_reports.xlsx"));
  }
  function exportPdf() {
    exportTableToPdf(
      tr("التقارير العامة", "General Reports"),
      tr(
        ["المركبة", "الرحلات", "تم التسليم", "لم يتم", "المسافة (كم)", "اللترات", "كم/لتر", "لتر/100كم", "تكلفة الوقود", "تكلفة الصيانة", "إجمالي التشغيل", "تكلفة/كم"],
        ["Vehicle", "Trips", "Delivered", "Undelivered", "Distance (km)", "Liters", "Km/L", "L/100km", "Fuel cost", "Maint. cost", "Total cost", "Cost/km"]
      ),
      perVehicle.map(r => [
        r.plate, r.tripsCount, r.deliveredCount, r.undeliveredCount, round1(r.totalDistance), round1(r.totalLiters), round2(r.kmPerLiter), round2(r.literPer100km),
        round1(r.fuelCost), round1(r.maintenanceCost), round1(r.totalOperationalCost), round2(r.costPerKm),
      ]),
      tr("التقارير_العامة.pdf", "general_reports.pdf")
    );
  }

  return (
    <div>
      <h2 className="font-ui font-extrabold text-xl mb-1" style={{ color: C.text }}>{tr("التقارير العامة", "General Reports")}</h2>
      <p className="font-ui text-xs mb-5" style={{ color: C.muted }}>{tr("تجميع بيانات خط السير والوقود والصيانة لكل مركبة في فترة واحدة", "Route, fuel, and maintenance data aggregated per vehicle for a single period")}</p>

      <div className="flex items-center gap-2 flex-wrap mb-5">
        <input type="date" value={dateFrom} onChange={e => setDateFrom(e.target.value)} placeholder={tr("من تاريخ", "From")}
          className="flex-1 rounded-lg px-2 py-2 font-ui text-xs outline-none" style={{ background: C.surface2, border: `1px solid ${C.border}`, color: C.text }} />
        <input type="date" value={dateTo} onChange={e => setDateTo(e.target.value)} placeholder={tr("إلى تاريخ", "To")}
          className="flex-1 rounded-lg px-2 py-2 font-ui text-xs outline-none" style={{ background: C.surface2, border: `1px solid ${C.border}`, color: C.text }} />
        <select value={plateFilter} onChange={e => setPlateFilter(e.target.value)}
          className="flex-1 rounded-lg px-2 py-2 font-ui text-xs outline-none" style={{ background: C.surface2, border: `1px solid ${C.border}`, color: C.text }}>
          <option value="">{tr("كل المركبات", "All vehicles")}</option>
          {(vehicles || []).map(v => <option key={v.plate} value={v.plate}>{v.plate}</option>)}
        </select>
        <select value={repFilter} onChange={e => setRepFilter(e.target.value)}
          className="flex-1 rounded-lg px-2 py-2 font-ui text-xs outline-none" style={{ background: C.surface2, border: `1px solid ${C.border}`, color: C.text }}>
          <option value="">{tr("كل المندوبين", "All reps")}</option>
          {(employees || []).map(e => <option key={e.code} value={e.code}>{e.name} ({e.code})</option>)}
        </select>
      </div>

      <div className="flex flex-wrap gap-3 mb-6">
        <KpiCard icon={Navigation} value={totals.trips} label={tr("إجمالي عدد الرحلات", "Total trips")} color={C.teal} />
        <KpiCard icon={CheckCircle} value={totals.delivered} label={tr("عملاء تم التسليم لهم", "Delivered customers")} color={C.teal} />
        <KpiCard icon={XCircle} value={totals.undelivered} label={tr("عملاء لم يتم تسليمهم", "Undelivered customers")} color={totals.undelivered ? C.red : C.muted} />
        <KpiCard icon={TrendingUp} value={round1(totals.distance)} label={tr("إجمالي الكيلومترات", "Total kilometers")} color={C.teal} />
        <KpiCard icon={Fuel} value={round1(totals.liters)} label={tr("إجمالي الوقود المستهلك (لتر)", "Total fuel consumed (L)")} color={C.amber} />
        <KpiCard icon={Fuel} value={round1(totals.fuelCost)} label={tr("إجمالي تكلفة الوقود", "Total fuel cost")} color={C.amber} />
        <KpiCard icon={Wrench} value={round1(totals.maintenanceCost)} label={tr("إجمالي تكلفة الصيانة", "Total maintenance cost")} color={C.red} />
        <KpiCard icon={TrendingUp} value={round1(totals.operationalCost)} label={tr("التكلفة الإجمالية", "Total operational cost")} color={C.red} />

      <div className="flex items-center gap-2 mb-4">

      </div>

      {perVehicle.length === 0 ? (
        <EmptyState text={tr("لا توجد مركبات مسجَّلة بعد", "No vehicles registered yet")} />
      ) : (
        <div className="overflow-x-auto rounded-2xl" style={{ border: `1px solid ${C.border}` }}>
          <table className="w-full text-right" style={{ minWidth: 1080 }}>
            <thead>
              <tr style={{ background: C.surface2 }}>
                <th className="font-ui text-[11px] font-semibold text-right p-2.5" style={{ color: C.muted }}>{tr("المركبة", "Vehicle")}</th>

async function commitOpsChunked(ops) {
  for (let i = 0; i < ops.length; i += 450) {
    const chunk = ops.slice(i, i + 450);
    if (chunk.length === 0) continue;
    const batch = db.batch();
    chunk.forEach(op => {
      if (op.type === "delete") batch.delete(op.ref);
      else batch.set(op.ref, op.data);
    });
    await batch.commit();
  }
}

// سجل تدقيق بسيط لعمليات المسؤول الحساسة (إنشاء/حذف حساب، تفعيل/تعطيل،
// تغيير صلاحيات). كل سطر بيتسجل لوحده كـ document منفصل، من غير ما
// يعطّل العملية الأساسية لو الكتابة فشلت لأي سبب.
function logAudit(currentUser, action, details) {
  try {
    const id = String(Date.now()) + "_" + Math.random().toString(36).slice(2, 8);
    db.collection("etronic_data_v2").doc("etronic_audit_log").collection("items").doc(id).set({
      id, action, details: details || "", by: currentUser?.email || "غير معروف", at: new Date().toISOString(),
    }).catch(() => {});
  } catch (e) {}
}

// يخزّن كل سجل كـ document منفصل بدل مصفوفة واحدة ضخمة في document واحد.
// ده بيحل مشكلتين أساسيتين: حد الـ1MB لكل document في Firestore (كان
// ممكن يتحقق مع نمو بيانات العملاء/الوقود)، وتعارض الكتابة المتزامن
// (لو اتنين عدّلوا في نفس اللحظة، كل تعديل كان بيمسح تعديل التاني لأنه
// بيكتب فوق المصفوفة كاملة؛ دلوقتي كل سجل مستقل تمامًا عن باقي السجلات).
// أول مرة تلاقي الـ collection فاضية، بتهاجر البيانات أوتوماتيك من نظام
// التخزين القديم (etronic_data/{key})، والنسخة القديمة بتفضل موجودة
// كنسخة احتياطية ومبيتمسحش منها حاجة.
function useFirestoreCollection(key, initialFn, idField = "id") {
  const [state, setState] = useState(initialFn());
  const [ready, setReady] = useState(false);
  const stateRef = React.useRef(state);
  stateRef.current = state;
  const migratingRef = React.useRef(false);

  React.useEffect(() => {
    const colRef = db.collection("etronic_data_v2").doc(key).collection("items");
    const legacyRef = db.collection("etronic_data").doc(key);
    let cancelled = false;

    const unsub = colRef.onSnapshot(async (snap) => {
      if (cancelled) return;
      if (!snap.empty || migratingRef.current) {
        console.log("[etronic] collection", key, "loaded", snap.docs.length, "docs");
        setState(snap.docs.map(d => d.data()));
        setReady(true);
        return;
      }
      migratingRef.current = true;
      try {
        const legacySnap = await legacyRef.get();
        const legacyValue = legacySnap.exists ? legacySnap.data().value : null;
        const seed = Array.isArray(legacyValue) && legacyValue.length > 0 ? legacyValue : initialFn();
        const ops = seed.map(item => ({
          type: "set",
          ref: colRef.doc(String(item[idField] != null ? item[idField] : (Date.now() + Math.random()))),
          data: item,
        }));
        if (ops.length > 0) await commitOpsChunked(ops);
        else setReady(true);
      } catch (e) {
        console.error("[etronic] collection migration failed for", key, e);
        setReady(true);
      }
    }, (e) => {
      console.error("[etronic] collection onSnapshot error for", key, e);
      setReady(true);
    });

    return () => { cancelled = true; unsub(); };
  }, [key]);

  function setAndSync(updater) {
    const prev = stateRef.current;
    const next = typeof updater === "function" ? updater(prev) : updater;
    setState(next);
    announceSaving();
    const colRef = db.collection("etronic_data_v2").doc(key).collection("items");
    const nextIds = new Set(next.map(item => String(item[idField])));
    const ops = [
      ...next.map(item => ({ type: "set", ref: colRef.doc(String(item[idField])), data: item })),
      ...prev.filter(item => !nextIds.has(String(item[idField]))).map(item => ({ type: "delete", ref: colRef.doc(String(item[idField])) })),
    ];
    commitOpsChunked(ops).then(() => announceSaved(null)).catch(err => announceSaved(err));
  }

  return [state, setAndSync, ready];
}

// نفس فكرة useFirestoreCollection، بس لبيانات على شكل object/map (زي مواقع
// العملاء المخزنة بمفتاح uid لكل عميل) بدل array من السجلات
function useFirestoreMap(key, initialFn) {
  const [state, setState] = useState(initialFn());
  const [ready, setReady] = useState(false);
  const stateRef = React.useRef(state);
  stateRef.current = state;
  const migratingRef = React.useRef(false);

  React.useEffect(() => {
    const colRef = db.collection("etronic_data_v2").doc(key).collection("items");
    const legacyRef = db.collection("etronic_data").doc(key);
    let cancelled = false;

    const unsub = colRef.onSnapshot(async (snap) => {
      if (cancelled) return;
      if (!snap.empty || migratingRef.current) {
        console.log("[etronic] map", key, "loaded", snap.docs.length, "docs");
        const next = {};
        snap.docs.forEach(d => { next[d.id] = d.data(); });
        setState(next);
        setReady(true);
        return;
      }
      migratingRef.current = true;
      try {
        const legacySnap = await legacyRef.get();
        const legacyValue = legacySnap.exists ? legacySnap.data().value : null;
        const seed = legacyValue && typeof legacyValue === "object" ? legacyValue : initialFn();
        const ops = Object.entries(seed).map(([k, v]) => ({ type: "set", ref: colRef.doc(String(k)), data: v }));
        if (ops.length > 0) await commitOpsChunked(ops);
        else setReady(true);
      } catch (e) {
        console.error("[etronic] map migration failed for", key, e);
        setReady(true);
      }
    }, (e) => {
      console.error("[etronic] map onSnapshot error for", key, e);
      setReady(true);
    });

    return () => { cancelled = true; unsub(); };
  }, [key]);

  function setAndSync(updater) {
    const prev = stateRef.current;
    const next = typeof updater === "function" ? updater(prev) : updater;
    setState(next);
    announceSaving();
    const colRef = db.collection("etronic_data_v2").doc(key).collection("items");
    const ops = [
      ...Object.entries(next).map(([k, v]) => ({ type: "set", ref: colRef.doc(String(k)), data: v })),
      ...Object.keys(prev).filter(k => !(k in next)).map(k => ({ type: "delete", ref: colRef.doc(String(k)) })),
    ];
    commitOpsChunked(ops).then(() => announceSaved(null)).catch(err => announceSaved(err));
  }

  return [state, setAndSync, ready];
}

// ============================================================
// نظام إشعارات التنبيه داخل التطبيق (In-App Push Notifications)
// ============================================================
// يعمل بالكامل من طرف المتصفح دون الحاجة لخادم خلفي: يراقب نفس البيانات
// المعروضة في الشاشات لحظيًا (عبر Firestore)، وعند ظهور حالة جديدة تستحق
// تنبيهًا (صيانة متأخرة، انحراف حرج في الوقود، نقص وقود غير مفسَّر، تعذر
// تسليم) يُطلق إشعار متصفح حقيقي عبر Service Worker — حتى لو كان التطبيق
// في الخلفية أو التبويب غير مفتوح، طالما المتصفح يعمل.
function useNotificationPermission() {
  const [permission, setPermission] = useState(() =>
    typeof Notification !== "undefined" ? Notification.permission : "unsupported"
  );
  async function requestPermission() {
    if (typeof Notification === "undefined") return "unsupported";
    if (Notification.permission === "granted") { setPermission("granted"); return "granted"; }
    try {
      const result = await Notification.requestPermission();
      setPermission(result);
      return result;
    } catch (e) {
      setPermission("denied");
      return "denied";
    }
  }
  return [permission, requestPermission];
}

async function showFleetNotification(title, body, tag, data) {
  if (typeof Notification === "undefined" || Notification.permission !== "granted") return;
  const options = {
    body,
    icon: "./icon-192.png",
    badge: "./icon-192.png",
    tag,
    data: data || {},
    dir: "rtl",
    lang: "ar",
    renotify: false,
  };
  try {
    if ("serviceWorker" in navigator) {
      const reg = await navigator.serviceWorker.ready;
      await reg.showNotification(title, options);
    } else {
      new Notification(title, options);
    }
  } catch (e) {
    // فشل صامت — لا نريد كسر التطبيق بسبب مشكلة في الإشعارات
  }
}

// يسجّل جهاز المستخدم للحصول على Push حقيقي (يصل حتى لو التطبيق مغلق تمامًا)
// عبر Firebase Cloud Messaging، ويحفظ الـ token في Firestore حتى يقدر الخادم
// الخلفي (Cloud Functions) يرسل له إشعارات مباشرة. لا يفعل شيئًا إذا لم يُضبط
// FCM_VAPID_KEY بعد، أو لو المتصفح لا يدعم Push.
async function registerFcmToken(currentUser) {
  if (!messaging || !currentUser || !currentUser.email) return;
  if (FCM_VAPID_KEY === "REPLACE_WITH_VAPID_KEY") return;
  try {
    const reg = await navigator.serviceWorker.ready;
    const token = await messaging.getToken({ vapidKey: FCM_VAPID_KEY, serviceWorkerRegistration: reg });
    if (!token || !db) return;
    await db.collection("etronic_fcm_tokens").doc(token).set({
      token,
      email: currentUser.email,
      uid: currentUser.uid || "",
      platform: navigator.userAgent || "",
      updatedAt: new Date().toISOString(),
    });
  } catch (e) {
    // فشل صامت (رفض الإذن، أو المتصفح لا يدعم Push، أو خطأ شبكة) — لا يوقف باقي التطبيق
  }
}

// يقارن كل مجموعة تنبيهات بما سبق إرساله (محفوظ في localStorage) ويُطلق
// إشعارًا فعليًا للحالات الجديدة فقط، حتى لا تتكرر نفس الرسالة عند كل تحديث.
function useFleetAlertNotifications({ oilAlerts, criticalFuelAlerts, virtualTankAlerts, failedDeliveries, enabled }) {
  const seenRef = React.useRef(null);
  if (seenRef.current === null) {
    try {
      seenRef.current = new Set(JSON.parse(localStorage.getItem("etronic_notified_keys") || "[]"));
    } catch (e) {
      seenRef.current = new Set();
    }
  }

  React.useEffect(() => {
    if (!enabled) return;
    const seen = seenRef.current;
    let changed = false;

    (oilAlerts || []).forEach(a => {
      // إعادة التنبيه كل 500 كم إضافية بعد تجاوز الموعد، بدل تنبيه واحد فقط عند أول تجاوز
      const key = `oil:${a.plate}:${Math.floor(a.kmSinceOil / 500)}`;
      if (!seen.has(key)) {
        const body = a.lastOilOdometer > 0
          ? `المركبة ${a.plate} تجاوزت موعد تغيير الزيت بمقدار ${a.kmSinceOil.toFixed(0)} كم`
          : `المركبة ${a.plate} بحاجة إلى تسجيل أول عملية تغيير زيت — لا يوجد سجل سابق`;
        showFleetNotification(
          "⚠ صيانة متأخرة",
          body,
          `oil-${a.plate}`,
          { screen_to_open: "maintenance", entity_id: a.plate }
        );
        seen.add(key);
        changed = true;
      }
    });

    (criticalFuelAlerts || []).forEach(a => {
      const lastDate = a.rows && a.rows.length ? a.rows[a.rows.length - 1].date : "";
      const key = `fuel:${a.plate}:${lastDate}`;
      if (!seen.has(key)) {
        showFleetNotification(
          "🔴 اشتباه تلاعب في الوقود",
          `المركبة ${a.plate} سجّلت انحرافًا حرجًا بنسبة ${a.deviationPct.toFixed(0)}% عن معدلها الطبيعي`,
          `fuel-${a.plate}-${lastDate}`,
          { screen_to_open: "reports", entity_id: a.plate }
        );
        seen.add(key);
        changed = true;
      }
    });

    (virtualTankAlerts || []).forEach(t => {
      const last = t.discrepancies && t.discrepancies[t.discrepancies.length - 1]; // الأحدث (المصفوفة بترتيب تصاعدي بالتاريخ)
      if (!last) return;
      const key = `tank:${t.plate}:${last.date}`;
      if (!seen.has(key)) {
        showFleetNotification(
          "🛢️ نقص وقود غير مفسَّر",
          `المركبة ${t.plate} — فرق ${last.gap.toFixed(1)} لتر بين الكمية المتوقعة والكمية المضافة فعليًا`,
          `tank-${t.plate}-${last.date}`,
          { screen_to_open: "reports", entity_id: t.plate }
        );
        seen.add(key);
        changed = true;
      }
    });

    (failedDeliveries || []).forEach(d => {
      const key = `delivery:${d.id}`;
      if (!seen.has(key)) {
        showFleetNotification(
          "⚠ تعذر التسليم",
          `لم يتم تسليم طلب ${d.customerName || ""} — المندوب: ${d.repName || ""}`,
          `delivery-${d.id}`,
          { screen_to_open: "deliveries", entity_id: String(d.id) }
        );
        seen.add(key);
        changed = true;
      }
    });

    if (changed) {
      try {
        // نحتفظ بآخر 500 مفتاح فقط لتفادي تضخّم localStorage مع الوقت
        localStorage.setItem("etronic_notified_keys", JSON.stringify([...seen].slice(-500)));
      } catch (e) {}
    }
  }, [oilAlerts, criticalFuelAlerts, virtualTankAlerts, failedDeliveries, enabled]);
}

function EtronicDashboard({ user, isAdmin, permissions, theme, setTheme }) {
  const [tab, setTab] = useState("dash");
  const [lang, setLang] = useLang();
  const [fuelRecords, setFuelRecords, fuelReady] = useFirestoreCollection("etronic_fuel", () => []);
  const [maintenanceRecords, setMaintenanceRecords, maintenanceReady] = useFirestoreCollection("etronic_maintenance", () => []);
  const [routeStops, setRouteStops] = useState([]);
  const [customers, setCustomers, customersReady] = useFirestoreCollection("etronic_customers", () => CUSTOMERS.map((c, i) => ({ ...c, id: i })));
  const [employees, setEmployees, employeesReady] = useFirestoreCollection("etronic_employees", () => EMPLOYEES.map((e, i) => ({ ...e, id: i })));
  const [vehicles, setVehicles, vehiclesReady] = useFirestoreCollection("etronic_vehicles", () => VEHICLES.map((v, i) => ({ plate: v.plate, model: "", status: "نشطة", id: i })));
  const [odometerLogs, setOdometerLogs, odometerReady] = useFirestoreCollection("etronic_odometer", () => []);
  const [customerLocations, setCustomerLocations] = useFirestoreMap("etronic_customer_locations", () => ({}));
  const [accounts, setAccounts] = useFirestoreCollection("etronic_accounts", () => [], "email");
  const [auditLog] = useFirestoreCollection("etronic_audit_log", () => []);
  const [deliveries, setDeliveries] = useFirestoreCollection("etronic_deliveries", () => []);
  const dataReady = fuelReady && maintenanceReady && customersReady && employeesReady && vehiclesReady && odometerReady;

  // إشعارات التنبيه — تُحسب مرة واحدة هنا على مستوى التطبيق كله (وليس فقط
  // داخل التبويب المفتوح حاليًا)، حتى تُطلَق حتى لو كان المستخدم في شاشة أخرى.
  const [notifPermission, requestNotifPermission] = useNotificationPermission();
  const oilAlertsForNotify = useMemo(
    () => computeOilAlerts(vehicles, odometerLogs, fuelRecords, maintenanceRecords),
    [vehicles, odometerLogs, fuelRecords, maintenanceRecords]
  );
  const fleetAnalyticsForNotify = useMemo(() => computeFleetFuelAnalytics(vehicles || [], fuelRecords || []), [vehicles, fuelRecords]);
  const criticalFuelAlertsForNotify = useMemo(
    () => fleetAnalyticsForNotify.filter(a => a.alertLevel === "critical"),
    [fleetAnalyticsForNotify]
  );
  const virtualTankAlertsForNotify = useMemo(() => computeFleetVirtualTanks(vehicles || [], fuelRecords || []), [vehicles, fuelRecords]);
  const failedDeliveriesForNotify = useMemo(
    () => (deliveries || []).filter(d => d.status === "لم يتم التسليم"),
    [deliveries]
  );
  useFleetAlertNotifications({
    oilAlerts: oilAlertsForNotify,
    criticalFuelAlerts: criticalFuelAlertsForNotify,
    virtualTankAlerts: virtualTankAlertsForNotify,
    failedDeliveries: failedDeliveriesForNotify,
    enabled: dataReady && notifPermission === "granted",
  });

  // عند الضغط على إشعار والتطبيق مفتوح بالفعل، ننتقل مباشرة للتبويب
  // المقصود بدل فتح الصفحة الرئيسية فقط.
  React.useEffect(() => {
    if (!("serviceWorker" in navigator)) return;
    function handleMessage(event) {
      const msg = event.data;
      if (msg && msg.type === "notification_click" && msg.data && msg.data.screen_to_open) {
        setTab(msg.data.screen_to_open);
      }
    }
    navigator.serviceWorker.addEventListener("message", handleMessage);
    return () => navigator.serviceWorker.removeEventListener("message", handleMessage);
  }, []);

  // بمجرد منح إذن الإشعارات، نسجّل جهاز المستخدم في Firebase Cloud Messaging
  // حتى يقدر الخادم الخلفي يرسل له Push حقيقيًا حتى لو التطبيق مغلق.
  React.useEffect(() => {
    if (notifPermission === "granted") registerFcmToken(user);
  }, [notifPermission, user]);

  // رسائل Push اللي توصل والتطبيق مفتوح وموجود في المقدمة (Foreground) لا تظهر
  // تلقائيًا من المتصفح — لازم نعرضها يدويًا بنفس أسلوب الإشعارات المحلية.
  React.useEffect(() => {
    if (!messaging) return;
    const unsubscribe = messaging.onMessage((payload) => {
      const n = payload.notification || {};
      const d = payload.data || {};
      showFleetNotification(n.title || "", n.body || "", d.entity_id ? `${d.type}-${d.entity_id}` : undefined, d);
    });
    return () => { if (typeof unsubscribe === "function") unsubscribe(); };
  }, []);

  const RESTRICTED_KEYS = ["reports", "deliveries", "generalReports", "vehicles", "employees", "customers"];
  const BASE_USER_TABS = TABS.filter(t => !RESTRICTED_KEYS.includes(t.key));
  const grantedTabs = TABS.filter(t => RESTRICTED_KEYS.includes(t.key) && (permissions || []).includes(t.key));
  const visibleTabs = isAdmin ? [...TABS, { key: "admin", label: "الإدارة", icon: Users, comp: AdminTab }] : [...BASE_USER_TABS, ...grantedTabs];
  const activeTabDef = visibleTabs.find(t => t.key === tab) || visibleTabs[0];
  const Active = activeTabDef.comp;

  const extraProps = tab === "fuel"
    ? { records: fuelRecords, setRecords: setFuelRecords, vehicles, employees, isAdmin, currentUser: user, lang }
    : tab === "maintenance"
      ? { records: maintenanceRecords, setRecords: setMaintenanceRecords, fuelRecords, vehicles, odometerLogs, isAdmin, lang }
      : tab === "route"
        ? { stops: routeStops, setStops: setRouteStops, customerLocations, customers, employees, vehicles, deliveries, setDeliveries, currentUser: user, lang }
        : tab === "customers"
          ? { customers, setCustomers, customerLocations, setCustomerLocations, isAdmin, lang }
          : tab === "employees"
            ? { employees, setEmployees, isAdmin, lang }
            : tab === "vehicles"
              ? { vehicles, setVehicles, isAdmin, lang }
              : tab === "odometer"
                ? { logs: odometerLogs, setLogs: setOdometerLogs, vehicles, currentUser: user, isAdmin, lang }
                : tab === "reports"
                  ? { fuelRecords, odometerLogs, vehicles, deliveries, lang }
                  : tab === "deliveries"
                    ? { deliveries, setDeliveries, isAdmin, lang }
                    : tab === "generalReports"
                    ? { vehicles, fuelRecords, maintenanceRecords, deliveries, employees, lang }
                    : tab === "settings"
                    ? { currentUser: user, lang, setLang, theme, setTheme, notifPermission, requestNotifPermission }
                    : tab === "admin"
                      ? { accounts, setAccounts, currentUser: user, auditLog, lang }
                      : tab === "dash"
                        ? { customersCount: customers.length, employeesCount: employees.length, vehiclesCount: vehicles.length, fuelRecords, odometerLogs, maintenanceRecords, vehicles, lang }
                        : {};

  return (
    <div dir="rtl" className="font-ui min-h-screen flex" style={{ background: C.bg }}>
      <style>{FONTS}</style>
      <aside className="w-56 shrink-0 p-4 hidden md:flex flex-col gap-1" style={{ background: C.surface, borderLeft: `1px solid ${C.border}` }}>
        <img src={LOGO_URI} alt="Etronic Fleet" className="h-8 mb-6 px-2 object-contain" style={{ objectPosition: "right" }} />
        {visibleTabs.map(t => {
          const Icon = t.icon; const active = tab === t.key;
          const label = (TAB_LABELS[t.key] && TAB_LABELS[t.key][lang]) || t.label;
          return (
            <button key={t.key} onClick={() => setTab(t.key)}
              className="flex items-center gap-2 px-3 py-2.5 rounded-xl text-sm font-ui font-semibold text-right"
              style={{ background: active ? C.surface2 : "transparent", color: active ? C.amber : C.muted }}>
              <Icon size={16} /> {label}
            </button>
          );
        })}
        <div className="flex-1" />
        <div className="px-2 pt-3" style={{ borderTop: `1px solid ${C.border}` }}>

      <SaveIndicator />

  );
}

function LoginScreen({ errorMsg }) {
  const [lang] = useLang();
  const tr = (ar, en) => (lang === "en" ? en : ar);
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState(errorMsg || "");
  const [loading, setLoading] = useState(false);

  function handleLogin() {
    if (!email || !password) return;
    setError(""); setLoading(true);
    const cleanEmail = email.replace(/[\u200B-\u200F\u202A-\u202E\u2066-\u2069\s]/g, "");
    auth.signInWithEmailAndPassword(cleanEmail, password)
      .catch(err => setError(tr("تعذّر تسجيل الدخول: ", "Couldn't sign you in: ") + err.message))
      .finally(() => setLoading(false));
  }

  return (
    <div dir="rtl" className="font-ui min-h-screen flex items-center justify-center p-6" style={{ background: C.bg }}>
      <style>{FONTS}</style>
      <div className="w-full max-w-sm rounded-2xl p-6" style={{ background: C.surface, border: `1px solid ${C.border}` }}>
        <img src={LOGO_URI} alt="Etronic Fleet" className="h-14 mb-1 mx-auto object-contain" />
        <p className="font-ui text-xs mb-6 text-center" style={{ color: C.muted }}>{tr("يرجى تسجيل الدخول لاستخدام النظام", "Sign in to use the system")}</p>
        <div className="space-y-3">
          <input type="email" placeholder={tr("البريد الإلكتروني", "Email")} value={email} onChange={e => setEmail(e.target.value)}
            className="w-full rounded-lg px-3 py-2.5 font-ui text-sm outline-none" style={{ background: C.surface2, border: `1px solid ${C.border}`, color: C.text }} />
          <input type="password" placeholder={tr("كلمة المرور", "Password")} value={password} onChange={e => setPassword(e.target.value)}
            onKeyDown={e => e.key === "Enter" && handleLogin()}
            className="w-full rounded-lg px-3 py-2.5 font-ui text-sm outline-none" style={{ background: C.surface2, border: `1px solid ${C.border}`, color: C.text }} />
          {error && <p className="font-ui text-xs" style={{ color: C.red }}>{error}</p>}
          <button onClick={handleLogin} disabled={loading}
            className="w-full py-2.5 rounded-lg font-ui text-sm font-bold disabled:opacity-50" style={{ background: C.amber, color: "#0B0E13" }}>
            {loading ? tr("جارٍ الدخول...", "Signing in...") : tr("تسجيل الدخول", "Sign in")}
          </button>
        </div>
      </div>
    </div>
  );
}
