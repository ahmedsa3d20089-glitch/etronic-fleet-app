<script>
  // يمنع "ومضة" الخلفية الداكنة قبل ما React يبدأ، لو المستخدم كان مختار

<body>
<div id="root"></div>

<!-- ============================================================ -->
<!-- SPLASH SCREEN — إضافة فقط، بدون أي تعديل على باقي التطبيق -->
<!-- ============================================================ -->
<style>
  #etronic-splash{
    position:fixed; inset:0; z-index:9999;
    background:#12151B;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    transition:opacity .6s ease, filter .6s ease;
  }
  #etronic-splash.etronic-splash-hide{ opacity:0; filter:blur(6px); pointer-events:none; }

  .etronic-splash-logo{
    width:64px; height:64px; border-radius:16px; object-fit:cover;
    opacity:0; transform:translateY(8px);
    animation:etronicSplashIn .6s ease forwards .1s;
  }
  .etronic-splash-name{
    margin-top:14px; font-family:'Segoe UI', Tahoma, Arial, sans-serif;
    font-size:20px; font-weight:700; letter-spacing:.02em; color:#EBF0F5;
    opacity:0; animation:etronicSplashIn .6s ease forwards .22s;
  }
  @keyframes etronicSplashIn{ to{ opacity:1; transform:translateY(0); } }

  .etronic-splash-track{ position:relative; width:min(360px, 78vw); margin-top:38px; height:58px; }
  .etronic-splash-road{
    position:absolute; bottom:8px; right:0; left:0; height:2px;
    background:repeating-linear-gradient(90deg, #223041 0 12px, transparent 12px 24px);
    animation:etronicRoadMove .6s linear infinite;
  }
  @keyframes etronicRoadMove{ to{ background-position-x:36px; } }

  .etronic-splash-truck{ position:absolute; bottom:8px; right:-84px; animation:etronicDrive 2.3s cubic-bezier(.45,.05,.55,.95) infinite; }
  @keyframes etronicDrive{
    0%{ right:-84px; }
    85%{ right:calc(100% + 84px); }
    100%{ right:calc(100% + 84px); }
  }
  .etronic-truck-wheel{ transform-origin:center; animation:etronicSpin .32s linear infinite; }
  @keyframes etronicSpin{ to{ transform:rotate(-360deg); } }
  .etronic-truck-body{ animation:etronicBounce .42s ease-in-out infinite; transform-origin:center; }
  @keyframes etronicBounce{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-1.4px); } }
  .etronic-truck-streak{ animation:etronicStreak 2.3s cubic-bezier(.45,.05,.55,.95) infinite; }
  @keyframes etronicStreak{ 0%,15%{ opacity:0; } 20%,80%{ opacity:1; } 100%{ opacity:0; } }

  @media (prefers-reduced-motion: reduce){
    #etronic-splash *{ animation-duration:.01ms !important; animation-iteration-count:1 !important; }
  }
</style>

<div id="etronic-splash">
  <img class="etronic-splash-logo" src="icon-192.png" alt="Etronic Fleet" />
  <span class="etronic-splash-name">Etronic Fleet</span>
  <div class="etronic-splash-track" aria-hidden="true">
    <div class="etronic-splash-road"></div>
    <svg class="etronic-splash-truck" width="84" height="46" viewBox="0 0 150 80" fill="none" style="transform:scaleX(-1)">
      <defs>
        <linearGradient id="etronicTruckCyan" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#8FEFE7"/>
          <stop offset="45%" stop-color="#35C7C0"/>
          <stop offset="100%" stop-color="#186B65"/>
        </linearGradient>
        <linearGradient id="etronicTruckCab" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#33475C"/>
          <stop offset="100%" stop-color="#151D26"/>
        </linearGradient>
        <linearGradient id="etronicTruckGlass" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#BFE3F0"/>
          <stop offset="55%" stop-color="#6C93A8"/>
          <stop offset="100%" stop-color="#3C5A6C"/>
        </linearGradient>
        <linearGradient id="etronicTruckChrome" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#E7ECF0"/>
          <stop offset="55%" stop-color="#98A4AF"/>
          <stop offset="100%" stop-color="#4B5560"/>
        </linearGradient>
        <radialGradient id="etronicTruckRim" cx="35%" cy="35%" r="70%">
          <stop offset="0%" stop-color="#EEF2F5"/>
          <stop offset="55%" stop-color="#8D97A2"/>
          <stop offset="100%" stop-color="#333A42"/>
        </radialGradient>
        <radialGradient id="etronicTruckHeadlight" cx="45%" cy="40%" r="65%">
          <stop offset="0%" stop-color="#FFFBEA"/>
          <stop offset="60%" stop-color="#FFDE8A"/>
          <stop offset="100%" stop-color="#F5A524"/>
        </radialGradient>
        <radialGradient id="etronicTruckShadow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#000000" stop-opacity=".38"/>
          <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
        </radialGradient>
      </defs>

      <!-- خطوط حركة خلف الشاحنة -->
      <g class="etronic-truck-streak">
        <line x1="-16" y1="24" x2="-3" y2="24" stroke="#35C7C0" stroke-width="2.2" stroke-linecap="round" opacity=".55"/>
        <line x1="-20" y1="36" x2="-4" y2="36" stroke="#35C7C0" stroke-width="2.2" stroke-linecap="round" opacity=".35"/>
        <line x1="-14" y1="48" x2="-2" y2="48" stroke="#35C7C0" stroke-width="2.2" stroke-linecap="round" opacity=".2"/>

<script>
  (function () {
    var splash = document.getElementById('etronic-splash');
    var root = document.getElementById('root');
    var hidden = false;
    var appReady = false;
    var MIN_DISPLAY_MS = 2800; // أقل مدة عرض للشاشة الافتتاحية، حتى لو التطبيق خلص تحميله أسرع من كده
    var startedAt = Date.now();

    function hideSplash() {
      if (hidden) return;
      hidden = true;
      splash.classList.add('etronic-splash-hide');
      setTimeout(function () { splash.remove(); }, 650);
    }
    function tryHide() {
      if (!appReady) return;
      var elapsed = Date.now() - startedAt;
      var remaining = MIN_DISPLAY_MS - elapsed;
      if (remaining > 0) {
        setTimeout(hideSplash, remaining);
      } else {
        hideSplash();
      }
    }
    // بيختفي بعد ما التطبيق يخلص تحميل ويرسم أول شاشة فعلية، بس مش قبل ما
    // تعدي مدة العرض الأدنى (MIN_DISPLAY_MS) حتى لو التحميل كان سريع جدًا —
    // وفيه حد أقصى للانتظار عشان الشاشة الافتتاحية متفضلش عالقة لو حصل أي
    // تأخير غير متوقع في التحميل
    var observer = new MutationObserver(function () {
      if (root.children.length > 0) {
        observer.disconnect();
        appReady = true;
        tryHide();
      }
    });
    observer.observe(root, { childList: true });
    setTimeout(function () { appReady = true; tryHide(); }, 5000);
  })();
</script>

// C بتفضل نفس الـ object reference دايمًا (const)، وبس بنغيّر القيم اللي
// جواها. الكومبوننتس كلها بتقرا C.text / C.bg... وقت الـ render، فلما
// نغيّر القيم ونجبر الشجرة تتعمل remount (عن طريق key={theme})، كل
// الألوان بتتحدث تلقائي من غير ما نلمس أي كومبوننت من الآلاف اللي بيستخدموا C.
const C = { ...DARK_PALETTE };
function applyTheme(theme) {
  Object.assign(C, theme === "light" ? LIGHT_PALETTE : DARK_PALETTE);
  try {
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.content = C.bg;
  } catch (e) {}
}

// شارت حديث بديل للنسخة القديمة الثابتة: أعمدة SVG بتتحرك لما الصفحة
// تفتح (CSS transition)، Tooltip بيظهر عند الوقوف بالماوس/اللمس فوق
// أي عمود، وLegend تحت. الألوان بتتاخد من نظام الألوان الحالي للتطبيق
// (المتغير C) — يعني لو أضفنا وضع فاتح (Light theme) مستقبلاً، الشارت
// هيتلوّن معاه تلقائي من غير أي تعديل هنا.
function FleetChart({ data, unit, legendItems }) {
  const [hoverIdx, setHoverIdx] = useState(null);
  const [grown, setGrown] = useState(false);
  React.useEffect(() => {
    setGrown(false);
    const t = setTimeout(() => setGrown(true), 60);
    return () => clearTimeout(t);
  }, [data.map(d => d.label + d.value).join(",")]);

  const max = Math.max(...data.map(d => d.value), 1);
  const barWidth = 30, gap = 16, chartHeight = 140, topPad = 30, bottomPad = 22;
  const svgWidth = Math.max(data.length * (barWidth + gap) + gap, 260);

  return (
    <div>
      <div style={{ overflowX: "auto" }}>
        <svg viewBox={`0 0 ${svgWidth} ${chartHeight + topPad + bottomPad}`} width="100%" height={chartHeight + topPad + bottomPad} style={{ minWidth: svgWidth, display: "block" }}>
          {/* خطوط الشبكة الأفقية */}
          {[0, 0.25, 0.5, 0.75, 1].map(f => (
            <line key={f} x1={0} x2={svgWidth} y1={topPad + chartHeight * (1 - f)} y2={topPad + chartHeight * (1 - f)}
              stroke={C.border} strokeWidth={1} strokeDasharray="3,3" />
          ))}
          {data.map((d, i) => {
            const h = grown ? Math.max((d.value / max) * chartHeight, 2) : 0;
            const x = gap + i * (barWidth + gap);
            const y = topPad + chartHeight - h;
            const isHover = hoverIdx === i;
            const barColor = d.color || C.teal;
            return (
              <g key={d.label}
                onMouseEnter={() => setHoverIdx(i)} onMouseLeave={() => setHoverIdx(null)}
                onTouchStart={() => setHoverIdx(isHover ? null : i)}
                style={{ cursor: "pointer" }}>
                <rect x={x} y={topPad} width={barWidth} height={chartHeight} fill="transparent" />
                <rect x={x} y={y} width={barWidth} height={h} rx={6}
                  fill={barColor} opacity={isHover ? 1 : 0.82}
                  style={{ transition: "height 0.7s cubic-bezier(.22,1,.36,1), y 0.7s cubic-bezier(.22,1,.36,1), opacity 0.15s" }} />
                <text x={x + barWidth / 2} y={topPad + chartHeight + 15} textAnchor="middle" fontSize="9" fill={C.muted} fontFamily="monospace">{d.label}</text>
                {isHover && (
                  <g style={{ transition: "opacity 0.15s" }}>
                    <rect x={Math.max(2, Math.min(svgWidth - barWidth - 26, x - 8))} y={Math.max(0, y - 24)} width={barWidth + 16} height={20} rx={5}
                      fill={C.surface} stroke={C.border} strokeWidth={1} />
                    <text x={Math.max(2, Math.min(svgWidth - barWidth - 26, x - 8)) + (barWidth + 16) / 2} y={Math.max(0, y - 24) + 14}
                      textAnchor="middle" fontSize="10" fontWeight="bold" fill={C.text} fontFamily="monospace">
                      {d.value.toFixed(2)}{unit || ""}
                    </text>
                  </g>
                )}
              </g>
            );
          })}
        </svg>
      </div>
      {legendItems && legendItems.length > 0 && (
        <div className="flex items-center gap-4 mt-2 flex-wrap justify-center">
          {legendItems.map(l => (
            <div key={l.label} className="flex items-center gap-1.5">
              <span style={{ width: 9, height: 9, borderRadius: 3, background: l.color, display: "inline-block" }} />
              <span className="font-ui text-[10px]" style={{ color: C.muted }}>{l.label}</span>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// شارت مقارنة احترافي (Grouped bars): بيقارن "الحالي" بـ"المتوسط التاريخي"
// لكل مركبة جنب بعض — نفس محرك التحليل اللي بيغذّي تاب التقارير بالظبط
// (computeFleetFuelAnalytics)، فأي حاجة تتغيّر في التقارير بتتحدث هنا
// تلقائيًا من غير ما نكرر أي حساب.
function FleetComparisonChart({ data, unit, seriesLabels }) {
  const [hoverIdx, setHoverIdx] = useState(null);
  const [grown, setGrown] = useState(false);
  React.useEffect(() => {
    setGrown(false);
    const t = setTimeout(() => setGrown(true), 60);
    return () => clearTimeout(t);
  }, [data.map(d => d.label + d.current + d.average).join(",")]);

  const max = Math.max(...data.map(d => Math.max(d.current, d.average)), 1);
  const groupWidth = 50, barWidth = 20, barGap = 4, groupGap = 16, chartHeight = 340, topPad = 34, bottomPad = 24;
  const svgWidth = Math.max(data.length * (groupWidth + groupGap) + groupGap, 260);

  const colorFor = (d) => d.alertLevel === "critical" ? C.red : d.alertLevel === "warning" ? C.amber : C.teal;

  return (
    <div>
      <svg viewBox={`0 0 ${svgWidth} ${chartHeight + topPad + bottomPad}`} width="100%" height={chartHeight + topPad + bottomPad} style={{ display: "block" }} preserveAspectRatio="xMidYMid meet">
        {[0, 0.25, 0.5, 0.75, 1].map(f => (
            <line key={f} x1={0} x2={svgWidth} y1={topPad + chartHeight * (1 - f)} y2={topPad + chartHeight * (1 - f)}
              stroke={C.border} strokeWidth={1} strokeDasharray="3,3" />
          ))}
          {data.map((d, i) => {
            const gx = groupGap + i * (groupWidth + groupGap);
            const curH = grown ? Math.max((d.current / max) * chartHeight, 2) : 0;
            const avgH = grown ? Math.max((d.average / max) * chartHeight, 2) : 0;
            const isHover = hoverIdx === i;
            const curColor = colorFor(d);
            const tipH = 34;
            const tipY = Math.max(2, topPad + chartHeight - Math.max(curH, avgH) - tipH - 6);
            return (
              <g key={d.label}
                onMouseEnter={() => setHoverIdx(i)} onMouseLeave={() => setHoverIdx(null)}
                onTouchStart={() => setHoverIdx(isHover ? null : i)}
                style={{ cursor: "pointer" }}>
                <rect x={gx} y={topPad} width={groupWidth} height={chartHeight} fill="transparent" />
                <rect x={gx + groupWidth / 2 - barWidth - barGap / 2} y={topPad + chartHeight - curH} width={barWidth} height={curH} rx={4}
                  fill={curColor} opacity={isHover ? 1 : 0.85}
                  style={{ transition: "height 0.7s cubic-bezier(.22,1,.36,1), y 0.7s cubic-bezier(.22,1,.36,1), opacity 0.15s" }} />
                <rect x={gx + groupWidth / 2 + barGap / 2} y={topPad + chartHeight - avgH} width={barWidth} height={avgH} rx={4}
                  fill={C.muted} opacity={isHover ? 0.9 : 0.45}
                  style={{ transition: "height 0.7s cubic-bezier(.22,1,.36,1), y 0.7s cubic-bezier(.22,1,.36,1), opacity 0.15s" }} />
                <text x={gx + groupWidth / 2} y={topPad + chartHeight + 15} textAnchor="middle" fontSize="9" fill={C.muted} fontFamily="monospace">{d.label}</text>
                {isHover && (
                  <g>
                    <rect x={gx} y={tipY} width={groupWidth} height={tipH} rx={5} fill={C.surface} stroke={C.border} strokeWidth={1} />
                    <text x={gx + groupWidth / 2} y={tipY + 14} textAnchor="middle" fontSize="9" fontWeight="bold" fill={curColor} fontFamily="monospace">{d.current.toFixed(2)}{unit}</text>
                    <text x={gx + groupWidth / 2} y={tipY + 27} textAnchor="middle" fontSize="9" fill={C.muted} fontFamily="monospace">{d.average.toFixed(2)}{unit}</text>
                  </g>
                )}
              </g>
            );
          })}
        </svg>
      {seriesLabels && (
        <div className="flex items-center gap-4 mt-2 flex-wrap justify-center">
          {seriesLabels.map(l => (
            <div key={l.label} className="flex items-center gap-1.5">
              <span style={{ width: 9, height: 9, borderRadius: 3, background: l.color, display: "inline-block" }} />
              <span className="font-ui text-[10px]" style={{ color: C.muted }}>{l.label}</span>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// دائرة إحصائية (Donut Chart) بسيطة لعرض توزيع المركبات حسب الحالة —
// كل قطاع نسبة مئوية من الدائرة، مع رقم إجمالي في المنتصف وقائمة تفصيلية تحتها.
function DonutChart({ segments, centerValue, centerLabel }) {
  const total = segments.reduce((s, x) => s + x.value, 0) || 1;
  const r = 62, cx = 90, cy = 90, sw = 24;
  const circumference = 2 * Math.PI * r;
  let cumulative = 0;

  return (
    <div className="flex flex-col items-center">
      <svg viewBox="0 0 180 180" width="100%" style={{ maxWidth: 240, display: "block" }}>
        <g transform={`rotate(-90 ${cx} ${cy})`}>
          <circle cx={cx} cy={cy} r={r} fill="none" stroke={C.border} strokeWidth={sw} />
          {segments.filter(s => s.value > 0).map((s, i) => {
            const frac = s.value / total;
            const segLen = frac * circumference;
            const dashArray = `${segLen} ${circumference - segLen}`;
            const dashOffset = -cumulative;
            cumulative += segLen;
            return (
              <circle key={i} cx={cx} cy={cy} r={r} fill="none" stroke={s.color} strokeWidth={sw}
                strokeDasharray={dashArray} strokeDashoffset={dashOffset} strokeLinecap="butt"
                style={{ transition: "stroke-dasharray 0.8s cubic-bezier(.22,1,.36,1)" }} />
            );
          })}
        </g>
        <text x={cx} y={cy - 4} textAnchor="middle" fontSize="26" fontWeight="800" fill={C.text} fontFamily="monospace">{centerValue}</text>
        <text x={cx} y={cy + 16} textAnchor="middle" fontSize="10" fill={C.muted} fontFamily="monospace">{centerLabel}</text>
      </svg>
      <div className="w-full mt-3 space-y-1.5">
        {segments.map((s, i) => (
          <div key={i} className="flex items-center justify-between px-1">
            <div className="flex items-center gap-1.5">
              <span style={{ width: 9, height: 9, borderRadius: 3, background: s.color, display: "inline-block", flexShrink: 0 }} />
              <span className="font-ui text-[11.5px]" style={{ color: C.text }}>{s.label}</span>
            </div>
            <span className="font-mono text-[11.5px] font-semibold" style={{ color: C.muted }}>
              {s.value} <span style={{ opacity: .7 }}>({total ? Math.round((s.value / total) * 100) : 0}%)</span>
            </span>
          </div>
        ))}
      </div>
    </div>
  );
}

function DashboardTab({ customersCount, employeesCount, vehiclesCount, fuelRecords, odometerLogs, maintenanceRecords, vehicles, lang }) {
  const tr = (ar, en) => (lang === "en" ? en : ar);
  // التلوين والتنبيه بقوا معتمدين على انحراف كل مركبة عن متوسطها التاريخي
  // (مش على رقم ثابت للأسطول كله) — نفس منطق تاب التقارير بالظبط، ونفس
  // المحرك اللي بيغذّي الشارت الجديد تحت
  const fleetAnalytics = useMemo(() => computeFleetFuelAnalytics(vehicles || [], fuelRecords || []), [vehicles, fuelRecords]);
  const statusBreakdown = useMemo(() => {
    const critical = fleetAnalytics.filter(a => a.alertLevel === "critical").length;
    const warning = fleetAnalytics.filter(a => a.alertLevel === "warning").length;
    const normal = fleetAnalytics.filter(a => !a.alertLevel).length;
    const noData = Math.max(0, (vehiclesCount || 0) - fleetAnalytics.length);
    return { critical, warning, normal, noData };

function parseMapsLink(text) {
  if (!text) return null;
  const patterns = [
    /@(-?\d+\.\d+),(-?\d+\.\d+)/,
    /!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/,
    /[?&]q=(-?\d+\.\d+),(-?\d+\.\d+)/,
    /^(-?\d+\.\d+)\s*,\s*(-?\d+\.\d+)$/,
  ];
  for (const re of patterns) {
    const m = text.match(re);
    if (m) {
      const lat = parseFloat(m[1]), lng = parseFloat(m[2]);
      if (!isNaN(lat) && !isNaN(lng)) return { lat, lng };
    }
  }
  return null;
}

async function resolveMapsLink(text) {
  if (!text) return null;
  const direct = parseMapsLink(text);
  if (direct) return direct;
  // Shortened links (maps.app.goo.gl, goo.gl) don't contain coordinates in the URL itself —
  // we need to follow the redirect to get the real Google Maps URL, then parse that.
  if (!/goo\.gl/i.test(text)) return null;
  try {
    const proxied = `https://api.allorigins.win/get?url=${encodeURIComponent(text)}`;
    const res = await fetch(proxied);
    if (!res.ok) return null;
    const data = await res.json();
    const finalUrl = (data && data.status && data.status.url) || "";
    return parseMapsLink(finalUrl) || parseMapsLink((data && data.contents) || "");
  } catch (e) {
    return null;
  }
}

function openInGoogleMaps(loc, fallbackParts) {
  const q = loc
    ? `${loc.lat},${loc.lng}`
    : encodeURIComponent((fallbackParts || []).filter(Boolean).join(" "));
  window.open(`https://www.google.com/maps/search/?api=1&query=${q}`, "_blank");
}

  const [linkInput, setLinkInput] = useState("");

  const [lngInput, setLngInput] = useState("");

  const [filterTerritory, setFilterTerritory] = useState("");

    [...new Set(withUid.map(c => c.territory).filter(Boolean))].sort((a, b) => a.localeCompare(b)),
    [withUid]);
  const governorateOptions = useMemo(() =>
    [...new Set(withUid.map(c => c.governorate).filter(Boolean))].sort((a, b) => a.localeCompare(b)),
    [withUid]);

    ((c.name || "").toLowerCase().includes(q.toLowerCase()) || String(c.code).includes(q) || (c.territory || "").toLowerCase().includes(q.toLowerCase()))
    && (!filterTerritory || c.territory === filterTerritory)

  function addCustomer() {

    setCustomers(customers.filter(c => c.id !== id));
    setCustomerLocations(prev => {

      return next;

      return;
    }
    setSavingUid(uid);
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        setCustomerLocations(prev => ({
          ...prev,
          [uid]: { lat: pos.coords.latitude, lng: pos.coords.longitude, savedAt: new Date().toISOString() }

        setSavingUid(null);

// pub-sub خفيف لحالة الحفظ — تستخدمه هوكس التخزين (useFirestoreCollection/useFirestoreMap) وSaveIndicator بدون الحاجة لتمرير props لكل تبويب
const saveStatusListeners = new Set();
let saveStatusState = { count: 0, lastError: null };
function announceSaving() {
  saveStatusState = { ...saveStatusState, count: saveStatusState.count + 1 };
  saveStatusListeners.forEach(fn => fn(saveStatusState));
}
function announceSaved(err) {
  if (err) console.error("Etronic Fleet — فشل حفظ في Firestore:", err.code || "", err.message || err);
  saveStatusState = { count: Math.max(0, saveStatusState.count - 1), lastError: err || null };
  saveStatusListeners.forEach(fn => fn(saveStatusState));
}
function useSaveStatus() {
  const [status, setStatus] = useState(saveStatusState);
  React.useEffect(() => {
    saveStatusListeners.add(setStatus);
    return () => saveStatusListeners.delete(setStatus);
  }, []);
  return status;
}
function SaveIndicator() {
  const { count, lastError } = useSaveStatus();
  const [showSaved, setShowSaved] = useState(false);
  const prevCount = React.useRef(0);
  React.useEffect(() => {
    if (prevCount.current > 0 && count === 0 && !lastError) {
      setShowSaved(true);
      const t = setTimeout(() => setShowSaved(false), 1800);
      return () => clearTimeout(t);
    }
    prevCount.current = count;
  }, [count, lastError]);
  if (count === 0 && !showSaved && !lastError) return null;
  const label = lastError ? "⚠ فشل الحفظ — تأكد من الاتصال بالإنترنت" : (count > 0 ? "جارٍ الحفظ..." : "✓ تم الحفظ");
  const color = lastError ? C.red : (count > 0 ? C.amber : C.teal);
  return (
    <div className="fixed bottom-4 left-4 z-50 px-3 py-2 rounded-lg font-ui text-xs font-semibold shadow-lg"
      style={{ background: C.surface, border: `1px solid ${color}66`, color }}>
      {label}
    </div>
  );
}


// تصدير Excel حقيقي (.xlsx) باستخدام ExcelJS — مش مجرد CSV بامتداد تاني.
// بيدّي: رأس جدول Bold بخلفية لونية، عرض أعمدة تلقائي حسب المحتوى، تنسيق
// أرقام حقيقي (مش نص)، ودعم كامل لاتجاه RTL للعربي. مرر الأرقام كـ Number
// فعلي (مش String) عشان التنسيق والـ SUM في إكسل يشتغلوا صح.
function round2(n) { return Math.round((Number(n) || 0) * 100) / 100; }
function round1(n) { return Math.round((Number(n) || 0) * 10) / 10; }

// تحميل كسول (Lazy Load) لمكتبات التصدير الثقيلة — بتتحمّل أول مرة بس حد
// يستخدم زرار تصدير فعليًا، بدل ما تبطّئ فتح التطبيق من أول ثانية لكل الناس
// حتى لو محتاجينش التصدير خالص.
const _loadedScripts = {};
function loadScriptOnce(src) {
  if (_loadedScripts[src]) return _loadedScripts[src];
  _loadedScripts[src] = new Promise((resolve, reject) => {
    const script = document.createElement("script");
    script.src = src;
    script.onload = () => resolve();
    script.onerror = () => { delete _loadedScripts[src]; reject(new Error("فشل تحميل: " + src)); };
    document.head.appendChild(script);
  });
  return _loadedScripts[src];
}
async function ensureExcelJs() {
  if (!window.ExcelJS) await loadScriptOnce("https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js");
}
async function ensurePdfLibs() {
  if (!window.html2canvas) await loadScriptOnce("https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js");
  if (!window.jspdf) await loadScriptOnce("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js");
}

async function exportTableToXlsx(title, headers, rows, filename) {
  await ensureExcelJs();
  const workbook = new ExcelJS.Workbook();
  const sheet = workbook.addWorksheet((title || "Report").slice(0, 31), {
    views: [{ rightToLeft: true }],
  });

  const headerRow = sheet.addRow(headers);
  headerRow.eachCell(cell => {
    cell.font = { bold: true, color: { argb: "FFE8EAED" }, size: 11 };
    cell.fill = { type: "pattern", pattern: "solid", fgColor: { argb: "FF1B2430" } };
    cell.alignment = { horizontal: "center", vertical: "middle" };
    cell.border = { bottom: { style: "medium", color: { argb: "FF2AA9A0" } } };
  });
  headerRow.height = 24;

  rows.forEach((r, ri) => {
    const row = sheet.addRow(r);
    row.eachCell(cell => {
      cell.alignment = { horizontal: typeof cell.value === "number" ? "center" : "right", vertical: "middle" };
      if (typeof cell.value === "number") {
        cell.numFmt = Number.isInteger(cell.value) ? "#,##0" : "#,##0.00";
      }
      if (ri % 2 === 1) {
        cell.fill = { type: "pattern", pattern: "solid", fgColor: { argb: "FF10151C" } };
      }
    });
  });

  // عرض أعمدة تلقائي حسب أطول محتوى في العمود (حد أقصى وأدنى معقولين)
  headers.forEach((h, i) => {
    let maxLen = String(h || "").length;
    rows.forEach(r => {
      const v = r[i];
      const len = String(v == null ? "" : v).length;
      if (len > maxLen) maxLen = len;
    });
    sheet.getColumn(i + 1).width = Math.min(Math.max(maxLen + 3, 10), 42);
  });

  sheet.autoFilter = { from: { row: 1, column: 1 }, to: { row: 1, column: headers.length } };
  sheet.views = [{ rightToLeft: true, state: "frozen", ySplit: 1 }];

  const buffer = await workbook.xlsx.writeBuffer();
  const blob = new Blob([buffer], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

async function exportTableToPdf(title, headers, rows, filename) {
  await ensurePdfLibs();
  const wrapper = document.createElement("div");
  wrapper.style.position = "fixed";
  wrapper.style.top = "-99999px";
  wrapper.style.left = "-99999px";
  wrapper.style.width = "800px";
  wrapper.style.background = "#ffffff";
  wrapper.style.padding = "24px";
  wrapper.style.direction = "rtl";
  wrapper.style.fontFamily = "Tahoma, Arial, sans-serif";

  const headHtml = headers.map(h => `<th style="border:1px solid #ccc;padding:8px;background:#12151B;color:#fff;font-size:13px;text-align:right;">${h}</th>`).join("");
  const bodyHtml = rows.map(r => `<tr>${r.map(c => `<td style="border:1px solid #ccc;padding:8px;font-size:12px;color:#111;text-align:right;">${c}</td>`).join("")}</tr>`).join("");

  wrapper.innerHTML = `
    <h2 style="margin:0 0 4px;font-size:18px;color:#111;">${title}</h2>
    <p style="margin:0 0 14px;font-size:11px;color:#666;">Etronic Fleet Dashboard · ${new Date().toISOString().slice(0, 10)}</p>
    <table style="width:100%;border-collapse:collapse;">
      <thead><tr>${headHtml}</tr></thead>
      <tbody>${bodyHtml}</tbody>
    </table>
  `;
  document.body.appendChild(wrapper);

  try {
    const canvas = await html2canvas(wrapper, { scale: 2, backgroundColor: "#ffffff" });
    document.body.removeChild(wrapper);

    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF("p", "mm", "a4");
    const pageWidth = pdf.internal.pageSize.getWidth();
    const pageHeight = pdf.internal.pageSize.getHeight();
    const imgWidth = pageWidth;
    const imgHeight = (canvas.height * imgWidth) / canvas.width;
    const imgData = canvas.toDataURL("image/png");

    let heightLeft = imgHeight;
    let position = 0;
    pdf.addImage(imgData, "PNG", 0, position, imgWidth, imgHeight);
    heightLeft -= pageHeight;

    while (heightLeft > 0) {
      position = heightLeft - imgHeight;
      pdf.addPage();
      pdf.addImage(imgData, "PNG", 0, position, imgWidth, imgHeight);
      heightLeft -= pageHeight;
    }

    pdf.save(filename);
  } catch (err) {
    if (wrapper.parentNode) document.body.removeChild(wrapper);
    alert("حدث خطأ أثناء إنشاء PDF: " + err.message);
  }
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(",")[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// الصور اللي بتتاخد من كاميرا الموبايل بحجمها الأصلي ممكن توصل لكذا ميجابايت،
// وده أكبر بكتير من حد الـ1MB لكل document في Firestore — فكانت بتتسبب في
// فشل الحفظ بصمت (السجل كله، مش بس الصورة، مكنش بيتسجل). الدالة دي بتصغّر
// الصورة وتقلل جودتها قبل ما تتخزن، عشان الحفظ يشتغل من غير ما نأثر على
// وضوح الصورة كإثبات.
function compressImageForStorage(file, maxDim = 1000, quality = 0.6) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > maxDim || height > maxDim) {
          if (width > height) { height = Math.round(height * (maxDim / width)); width = maxDim; }
          else { width = Math.round(width * (maxDim / height)); height = maxDim; }
        }
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function ocrReceipt(base64) {
  const res = await fetch(`https://vision.googleapis.com/v1/images:annotate?key=${VISION_API_KEY}`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      requests: [{ image: { content: base64 }, features: [{ type: "TEXT_DETECTION" }] }]
    })
  });
  const data = await res.json();
  if (data?.responses?.[0]?.error) {
    throw new Error(data.responses[0].error.message || "خطأ من خدمة القراءة");
  }
  if (data?.error) {
    throw new Error(data.error.message || "خطأ من خدمة القراءة");
  }
  const text = data?.responses?.[0]?.fullTextAnnotation?.text || "";
  return text;
}

function parseReceiptText(text, vehiclesList, employeesList) {
  const result = { plate: "", date: "", liters: "", cost: "", odometer: "", driver: "" };
  if (!text) return result;

  // Plate: look for any known vehicle plate number appearing as a standalone number
  for (const v of vehiclesList) {
    const re = new RegExp(`(?:^|\\D)${v.plate}(?:\\D|$)`);
    if (re.test(text)) { result.plate = v.plate; break; }
  }

  // Driver: look for any known employee name appearing (partial match, case-insensitive)
  for (const emp of employeesList) {
    if (emp.name && text.toLowerCase().includes(String(emp.name).toLowerCase().split(" ")[0])) {
      result.driver = emp.name; break;
    }
  }

  // Date: dd/mm/yyyy, dd-mm-yyyy, yyyy-mm-dd
  let m = text.match(/(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/);
  if (m) {
    result.date = `${m[1]}-${String(m[2]).padStart(2, "0")}-${String(m[3]).padStart(2, "0")}`;
  } else {
    m = text.match(/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})/);
    if (m) result.date = `${m[3]}-${String(m[2]).padStart(2, "0")}-${String(m[1]).padStart(2, "0")}`;
  }

  // Liters: number followed by لتر / Ltr / L
  m = text.match(/(\d+(?:\.\d+)?)\s*(?:لتر|Ltr|litre|liter|L\b)/i);
  if (m) result.liters = m[1];

  // Odometer: number near عداد / كم / KM
  m = text.match(/(?:عداد|كم|km)\D{0,5}(\d{3,7})/i);
  if (m) result.odometer = m[1];

  // Total/cost: number near إجمالي / total / EGP / ج.م
  m = text.match(/(?:إجمالي|الإجمالي|total|EGP|ج\.?م)\D{0,5}(\d+(?:\.\d+)?)/i);
  if (m) result.cost = m[1];
  else {
    // fallback: largest decimal-looking number in text
    const nums = [...text.matchAll(/(\d+\.\d{1,2})/g)].map(x => parseFloat(x[1]));
    if (nums.length) result.cost = String(Math.max(...nums));
  }

  return result;
}

                  <th className="font-ui text-[11px] font-semibold text-right p-2.5" style={{ color: C.muted }}>{tr("المركبة", "Vehicle")}</th>
                  <th className="font-ui text-[11px] font-semibold text-right p-2.5" style={{ color: C.muted }}>{tr("السائق", "Driver")}</th>
                  <th className="font-ui text-[11px] font-semibold text-right p-2.5" style={{ color: C.muted }}>{tr("التاريخ", "Date")}</th>
                  <th className="font-ui text-[11px] font-semibold text-right p-2.5" style={{ color: C.muted }}>{tr("لتر", "Liters")}</th>
                  <th className="font-ui text-[11px] font-semibold text-right p-2.5" style={{ color: C.muted }}>{tr("التكلفة", "Cost")}</th>
                  <th className="font-ui text-[11px] font-semibold text-right p-2.5" style={{ color: C.muted }}>{tr("العداد", "Odometer")}</th>
                  <th className="font-ui text-[11px] font-semibold text-right p-2.5" style={{ color: C.muted }}>{tr("صورة", "Photo")}</th>
                  <th className="font-ui text-[11px] font-semibold text-right p-2.5" style={{ color: C.muted }}></th>
                </tr>
              </thead>
              <tbody>
                {paged.map(r => editingId === r.id ? (
                  <tr key={r.id} style={{ borderTop: `1px solid ${C.border}`, background: `${C.teal}0d` }}>
                    <td className="p-2">
                      <select value={editForm.plate} onChange={e => setEditForm({ ...editForm, plate: e.target.value })}
                        className="rounded-lg px-2 py-1.5 font-ui text-xs outline-none w-24" style={{ background: C.surface2, border: `1px solid ${C.border}`, color: C.text }}>
                        {vehicles.map(v => <option key={v.plate} value={v.plate}>{v.plate}</option>)}
                      </select>
                    </td>
                    <td className="p-2">
                      <input type="text" value={editForm.driver} onChange={e => setEditForm({ ...editForm, driver: e.target.value })}
                        className="rounded-lg px-2 py-1.5 font-ui text-xs outline-none w-24" style={{ background: C.surface2, border: `1px solid ${C.border}`, color: C.text }} />
                    </td>
                    <td className="p-2">
                      <input type="date" value={editForm.date} onChange={e => setEditForm({ ...editForm, date: e.target.value })}
                        className="rounded-lg px-2 py-1.5 font-ui text-xs outline-none" style={{ background: C.surface2, border: `1px solid ${C.border}`, color: C.text }} />
                    </td>
                    <td className="p-2">
                      <input type="number" value={editForm.liters} onChange={e => setEditForm({ ...editForm, liters: e.target.value })}
                        className="rounded-lg px-2 py-1.5 font-mono text-xs outline-none w-16" style={{ background: C.surface2, border: `1px solid ${C.border}`, color: C.text }} />
                    </td>
                    <td className="p-2">
                      <input type="number" value={editForm.cost} onChange={e => {
                          const cost = e.target.value;
                          setEditForm({ ...editForm, cost, liters: cost !== "" ? (Number(cost) / FUEL_PRICE_PER_LITER).toFixed(2) : editForm.liters });
                        }}
                        className="rounded-lg px-2 py-1.5 font-mono text-xs outline-none w-16" style={{ background: C.surface2, border: `1px solid ${C.border}`, color: C.text }} />
                    </td>
                    <td className="p-2">
                      <input type="number" value={editForm.odometer} onChange={e => setEditForm({ ...editForm, odometer: e.target.value })}
                        className="rounded-lg px-2 py-1.5 font-mono text-xs outline-none w-20" style={{ background: C.surface2, border: `1px solid ${C.border}`, color: C.text }} />
                    </td>
                    <td className="p-2"></td>
                    <td className="p-2">
                      <div className="flex items-center gap-1.5">
                        <button onClick={saveEdit} className="px-2.5 py-1.5 rounded-lg font-ui text-[11px] font-semibold" style={{ background: `${C.teal}22`, color: C.teal }}>{tr("حفظ", "Save")}</button>
                        <button onClick={cancelEdit} className="px-2.5 py-1.5 rounded-lg font-ui text-[11px] font-semibold" style={{ background: C.surface2, color: C.muted }}>{tr("إلغاء", "Cancel")}</button>
                      </div>
                    </td>
                  </tr>
                ) : (
                  <tr key={r.id} style={{ borderTop: `1px solid ${C.border}` }}>
                    <td className="p-2.5 font-mono text-xs font-bold" style={{ color: C.text }}>{r.plate}</td>
                    <td className="p-2.5 font-ui text-xs" style={{ color: C.text }}>{r.driver || "—"}</td>
                    <td className="p-2.5 font-ui text-xs" style={{ color: C.muted }}>{r.date}</td>
                    <td className="p-2.5 font-mono text-xs" style={{ color: C.text }}>{r.liters}</td>
                    <td className="p-2.5 font-mono text-xs font-bold" style={{ color: C.amber }}>{r.cost}</td>
                    <td className="p-2.5 font-mono text-xs" style={{ color: C.muted }}>{r.odometer || "—"}</td>
                    <td className="p-2.5">{r.photo && <PhotoThumb src={r.photo} alt={tr("إيصال", "receipt")} onView={setViewPhoto} />}</td>
                    <td className="p-2.5">
                      <div className="flex items-center gap-1.5">
                        <button onClick={() => startEdit(r)} className="p-1.5 rounded-lg" style={{ background: `${C.teal}18` }}>
                          <Edit size={13} color={C.teal} />
                        </button>
                        {isAdmin && (
                          <button onClick={() => removeRecord(r.id)} className="p-1.5 rounded-lg" style={{ background: `${C.red}18` }}>
                            <Trash2 size={13} color={C.red} />
                          </button>
                        )}
                      </div>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>

          {/* كروت للموبايل */}
          <div className="md:hidden space-y-2">
            {paged.map(r => editingId === r.id ? (
              <div key={r.id} className="rounded-xl p-3" style={{ background: C.surface, border: `1px solid ${C.teal}66` }}>
                <div className="grid grid-cols-2 md:grid-cols-6 gap-2">
                  <select value={editForm.plate} onChange={e => setEditForm({ ...editForm, plate: e.target.value })}
                    className="rounded-lg px-2 py-2 font-ui text-xs outline-none" style={{ background: C.surface2, border: `1px solid ${C.border}`, color: C.text }}>
                    {vehicles.map(v => <option key={v.plate} value={v.plate}>{v.plate}</option>)}
                  </select>
                  <input type="text" placeholder={tr("السائق", "Driver")} value={editForm.driver} onChange={e => setEditForm({ ...editForm, driver: e.target.value })}
                    className="rounded-lg px-2 py-2 font-ui text-xs outline-none" style={{ background: C.surface2, border: `1px solid ${C.border}`, color: C.text }} />
                  <input type="date" value={editForm.date} onChange={e => setEditForm({ ...editForm, date: e.target.value })}
                    className="rounded-lg px-2 py-2 font-ui text-xs outline-none" style={{ background: C.surface2, border: `1px solid ${C.border}`, color: C.text }} />
                  <input type="number" placeholder={tr("لتر", "Liters")} value={editForm.liters} onChange={e => setEditForm({ ...editForm, liters: e.target.value })}
                    className="rounded-lg px-2 py-2 font-mono text-xs outline-none" style={{ background: C.surface2, border: `1px solid ${C.border}`, color: C.text }} />
                  <input type="number" placeholder={tr("التكلفة", "Cost")} value={editForm.cost} onChange={e => {
                      const cost = e.target.value;
                      setEditForm({ ...editForm, cost, liters: cost !== "" ? (Number(cost) / FUEL_PRICE_PER_LITER).toFixed(2) : editForm.liters });
                    }}
                    className="rounded-lg px-2 py-2 font-mono text-xs outline-none" style={{ background: C.surface2, border: `1px solid ${C.border}`, color: C.text }} />
                  <input type="number" placeholder={tr("العداد", "Odometer")} value={editForm.odometer} onChange={e => setEditForm({ ...editForm, odometer: e.target.value })}
                    className="rounded-lg px-2 py-2 font-mono text-xs outline-none" style={{ background: C.surface2, border: `1px solid ${C.border}`, color: C.text }} />
                </div>
                <div className="flex items-center gap-2 mt-2">
                  <button onClick={saveEdit} className="px-3 py-1.5 rounded-lg font-ui text-xs font-semibold" style={{ background: `${C.teal}22`, color: C.teal }}>{tr("حفظ", "Save")}</button>
                  <button onClick={cancelEdit} className="px-3 py-1.5 rounded-lg font-ui text-xs font-semibold" style={{ background: C.surface2, color: C.muted }}>{tr("إلغاء", "Cancel")}</button>
                </div>
              </div>
            ) : (
              <div key={r.id} className="flex items-center gap-3 rounded-xl p-3" style={{ background: C.surface, border: `1px solid ${C.border}` }}>
                <div className="w-9 h-9 rounded-full flex items-center justify-center shrink-0" style={{ background: `${C.teal}22` }}>
                  <Fuel size={14} color={C.teal} />
                </div>
                <div className="flex-1">
                  <p className="font-ui font-semibold text-sm" style={{ color: C.text }}>{tr("مركبة", "Vehicle")} {r.plate}{r.driver ? ` · ${r.driver}` : ""}</p>
                  <p className="font-ui text-xs" style={{ color: C.muted }}>{r.date} · {r.liters} {tr("لتر", "L")}{r.odometer ? ` · ${tr("عداد", "odometer")} ${r.odometer}` : ""}{r.enteredBy ? ` · ${tr("بواسطة", "by")} ${r.enteredBy}` : ""}</p>
                </div>
                {r.photo && <PhotoThumb src={r.photo} alt={tr("إيصال", "receipt")} onView={setViewPhoto} />}
                <span className="font-mono text-xs shrink-0" style={{ color: C.amber }}>{r.cost} {tr("ج.م", "EGP")}</span>
                <button onClick={() => startEdit(r)} className="p-1.5 rounded-lg shrink-0" style={{ background: `${C.teal}18` }}>
                  <Edit size={13} color={C.teal} />
                </button>
                {isAdmin && (
                  <button onClick={() => removeRecord(r.id)} className="p-1.5 rounded-lg shrink-0" style={{ background: `${C.red}18` }}>
                    <Trash2 size={13} color={C.red} />
                  </button>
                )}
              </div>
            ))}
          </div>
          <Pager page={page} setPage={setPage} total={filtered.length} />
        </>
      )}
      <PhotoLightbox photo={viewPhoto} onClose={() => setViewPhoto(null)} alt={tr("إيصال", "receipt")} />
    </div>
  );
}

function MaintenanceTab({ records, setRecords, fuelRecords, vehicles, odometerLogs, isAdmin, lang }) {
  const tr = (ar, en) => (lang === "en" ? en : ar);
  // القيم دي بتتخزن في البيانات نفسها، فمبتتغيرش حسب اللغة عشان ميحصلش
  // تعارض مع بيانات قديمة متخزنة بالفعل — بس العرض للمستخدم بيتترجم
  const TYPES = ["صيانة دورية", "إصلاح عطل", "تغيير الزيت", "إطارات", "أخرى"];
  const TYPE_LABELS = {
    "صيانة دورية": { ar: "صيانة دورية", en: "Routine maintenance" },
    "إصلاح عطل": { ar: "إصلاح عطل", en: "Repair" },
    "تغيير الزيت": { ar: "تغيير الزيت", en: "Oil change" },
    "إطارات": { ar: "إطارات", en: "Tires" },
    "أخرى": { ar: "أخرى", en: "Other" },
  };
  const OIL_INTERVAL_KM = 2000;
  // الأنواع دي بس هي اللي بتستخدم تفصيل المصاريف (بدل خانة تكلفة واحدة)
  const EXPENSE_BREAKDOWN_TYPES = ["صيانة دورية", "إصلاح عطل", "تغيير الزيت"];
  const emptyForm = { plate: "", date: "", type: TYPES[0], cost: "", description: "", nextDue: "", odometer: "", roadExpenses: "", tollFees: "", vehicleWash: "", spareParts: "", garageFees: "" };
  const [form, setForm] = useState(emptyForm);
  const [page, setPage] = useState(1);
  const [editingId, setEditingId] = useState(null);

  const usesBreakdown = EXPENSE_BREAKDOWN_TYPES.includes(form.type);
  const breakdownTotal = ["roadExpenses", "tollFees", "vehicleWash", "spareParts", "garageFees"]
    .reduce((s, k) => s + (Number(form[k]) || 0), 0);
  const [plateFilter, setPlateFilter] = useState("");
  const [dateFrom, setDateFrom] = useState("");
  const [dateTo, setDateTo] = useState("");

  const totalCost = records.reduce((s, r) => s + Number(r.cost || 0), 0);
  const today = new Date().toISOString().slice(0, 10);
  const upcoming = records.filter(r => r.nextDue && r.nextDue >= today).length;

  const oilAlerts = useMemo(
    () => computeOilAlerts(vehicles, odometerLogs, fuelRecords, records),
    [vehicles, odometerLogs, fuelRecords, records]
  );

  const sorted = useMemo(() => [...records].sort((a, b) => (b.date || "").localeCompare(a.date || "")), [records]);
  const filtered = useMemo(() => sorted.filter(r => {
    const matchesPlate = !plateFilter || r.plate === plateFilter;
    const matchesFrom = !dateFrom || (r.date || "") >= dateFrom;
    const matchesTo = !dateTo || (r.date || "") <= dateTo;
    return matchesPlate && matchesFrom && matchesTo;
  }), [sorted, plateFilter, dateFrom, dateTo]);
  const paged = filtered.slice((page - 1) * PAGE_SIZE, page * PAGE_SIZE);

  function exportMaintenanceXlsx() {
    const headers = tr(
      ["المركبة", "التاريخ", "النوع", "التكلفة الإجمالية", "مصاريف الطريق", "رسوم عبور", "غسيل المركبة", "قطع غيار", "أجرة الورشة", "قراءة العداد", "الصيانة القادمة", "ملاحظات"],
      ["Vehicle", "Date", "Type", "Total Cost", "Road expenses", "Toll fees", "Vehicle wash", "Spare parts", "Garage fees", "Odometer", "Next due", "Notes"]
    );
    const rows = filtered.map(r => [
      r.plate, r.date, tr(TYPE_LABELS[r.type]?.ar || r.type, TYPE_LABELS[r.type]?.en || r.type), r.cost,
      r.roadExpenses || "", r.tollFees || "", r.vehicleWash || "", r.spareParts || "", r.garageFees || "",
      r.odometer || "", r.nextDue || "", r.description || "",
    ]);
    exportTableToXlsx(tr("تقارير الصيانة", "Maintenance Reports"), headers, rows, tr("تقارير_الصيانة.xlsx", "maintenance_reports.xlsx"));
  }
  function exportMaintenancePdf() {
    exportTableToPdf(
      tr("تقارير الصيانة", "Maintenance Reports"),
      tr(
        ["المركبة", "التاريخ", "النوع", "التكلفة الإجمالية", "مصاريف الطريق", "عبور", "غسيل", "قطع غيار", "الورشة", "ملاحظات"],
        ["Vehicle", "Date", "Type", "Total Cost", "Road exp.", "Toll", "Wash", "Parts", "Garage", "Notes"]
      ),
      filtered.map(r => [
        r.plate, r.date, tr(TYPE_LABELS[r.type]?.ar || r.type, TYPE_LABELS[r.type]?.en || r.type), r.cost,
        r.roadExpenses || "", r.tollFees || "", r.vehicleWash || "", r.spareParts || "", r.garageFees || "", r.description || "",
      ]),
      tr("تقارير_الصيانة.pdf", "maintenance_reports.pdf")
    );
  }

  function addRecord() {
    // لأنواع الصيانة اللي بتستخدم تفصيل المصاريف، التكلفة الإجمالية بتتحسب
    // أوتوماتيك من مجموع البنود الخمسة، مش بتتكتب يدويًا.
    const finalCost = usesBreakdown ? breakdownTotal : Number(form.cost) || 0;
    if (!form.plate || !form.date || !finalCost) return;
    // قراءة العداد إلزامية عند تسجيل "تغيير الزيت" تحديدًا — بدونها لا يقدر
    // النظام يحسب متى موعد التغيير القادم، ويفضل يعتبر المركبة "بلا تغيير مسجَّل"
    // للأبد حتى لو المستخدم فعليًا غيّر الزيت.
    if (form.type === "تغيير الزيت" && !form.odometer) return;
    const dataToSave = { ...form, cost: finalCost };
    if (editingId !== null) {
      setRecords(records.map(r => (r.id === editingId ? { ...r, ...dataToSave } : r)));
      setEditingId(null);
    } else {
      setRecords([...records, { id: Date.now(), ...dataToSave }]);
    }
    setForm(emptyForm);
    setPage(1);
  }
  function startEdit(record) {
    setEditingId(record.id);
    setForm({
      plate: record.plate || "",
      date: record.date || "",
      type: record.type || TYPES[0],
      cost: record.cost || "",
      description: record.description || "",
      nextDue: record.nextDue || "",
      odometer: record.odometer || "",
      roadExpenses: record.roadExpenses || "",
      tollFees: record.tollFees || "",
      vehicleWash: record.vehicleWash || "",
      spareParts: record.spareParts || "",
      garageFees: record.garageFees || "",
    });
  }
  function cancelEdit() {
    setEditingId(null);
    setForm(emptyForm);
  }
  function removeRecord(id) {
    if (!confirm(tr("هل أنت متأكد من حذف سجل الصيانة هذا؟", "Are you sure you want to delete this maintenance record?"))) return;
    setRecords(records.filter(r => r.id !== id));
  }

  return (
    <div>
      <h2 className="font-ui font-extrabold text-xl mb-1" style={{ color: C.text }}>{tr("الصيانة", "Maintenance")}</h2>
      <p className="font-ui text-xs mb-5" style={{ color: C.muted }}>{tr("سجل أعمال الصيانة والإصلاحات لكل مركبة", "Log maintenance and repair work for each vehicle")}</p>

      <div className="flex flex-wrap gap-3 mb-6">
        <KpiCard icon={Wrench} value={records.length} label={tr("عدد أعمال الصيانة", "Number of maintenance jobs")} color={C.teal} />
        <KpiCard icon={TrendingUp} value={totalCost.toFixed(0)} label={tr("إجمالي التكلفة (ج.م)", "Total cost (EGP)")} color={C.red} />
        <KpiCard icon={Calendar} value={upcoming} label={tr("صيانات مجدولة قادمة", "Upcoming scheduled maintenance")} color={C.amber} />
        <KpiCard icon={Wrench} value={oilAlerts.length} label={tr("مركبات بحاجة إلى تغيير الزيت", "Vehicles needing oil change")} color={oilAlerts.length ? C.red : C.teal} />
      </div>

      <div className="rounded-2xl p-4 mb-6" style={{ background: C.surface, border: `1px solid ${C.border}` }}>
        <h3 className="font-ui font-bold text-sm mb-1" style={{ color: C.text }}>📊 {tr("تقارير الصيانة", "Maintenance Reports")}</h3>
        <p className="font-ui text-[11px] mb-3" style={{ color: C.muted }}>{tr("تصدير كل سجلات الصيانة (بعد تطبيق فلاتر المركبة والتاريخ أعلاه إن وُجدت)", "Export all maintenance records (after applying the vehicle/date filters above, if any)")}</p>
        <div className="flex items-center gap-2">
          <button onClick={exportMaintenanceXlsx} disabled={!filtered.length} className="px-2.5 py-1.5 rounded-lg font-ui text-[11px] font-semibold disabled:opacity-40" style={{ background: `${C.teal}22`, color: C.teal }}>⬇ Excel (.xlsx)</button>
          <button onClick={exportMaintenancePdf} disabled={!filtered.length} className="px-2.5 py-1.5 rounded-lg font-ui text-[11px] font-semibold disabled:opacity-40" style={{ background: `${C.red}18`, color: C.red }}>⬇ PDF</button>
        </div>
      </div>

      {oilAlerts.length > 0 && (
        <div className="rounded-2xl p-4 mb-6" style={{ background: `${C.red}11`, border: `1px solid ${C.red}44` }}>
          <h3 className="font-ui font-bold text-sm mb-3" style={{ color: C.red }}>⚠ {tr("تنبيهات تغيير الزيت", "Oil-change alerts")}</h3>
          <div className="space-y-2">
            {oilAlerts.map(a => (
              <div key={a.plate} className="flex items-center gap-3 rounded-xl p-2.5" style={{ background: C.surface }}>
                <span className="font-mono text-xs font-bold shrink-0" style={{ color: C.text }}>{tr("مركبة", "Vehicle")} {a.plate}</span>
                <span className="font-ui text-[11px] flex-1" style={{ color: C.muted }}>
                  {a.lastOilOdometer > 0 ? tr(`آخر تغيير زيت عند ${a.lastOilOdometer} كم`, `Last oil change at ${a.lastOilOdometer} km`) : tr("لا يوجد تغيير زيت مسجَّل سابقًا", "No oil change recorded yet")}
                </span>
                <span className="font-mono text-xs font-bold shrink-0" style={{ color: C.red }}>
                  {a.lastOilOdometer > 0
                    ? `${a.kmSinceOil.toFixed(0)} ${tr("كيلومترات منذ آخر تغيير", "km since last change")}`
                    : tr("يلزم تسجيل أول عملية تغيير زيت", "First oil change needs to be logged")}
                </span>
              </div>
            ))}
          </div>
          <p className="font-ui text-[11px] mt-2" style={{ color: C.muted }}>
            {tr(`* يظهر التنبيه عند تجاوز ${OIL_INTERVAL_KM} كم منذ آخر تغيير زيت، استنادًا إلى قراءة العداد المسجَّلة في تبويب "قراءة العداد"`, `* This alert appears once ${OIL_INTERVAL_KM} km have passed since the last oil change, based on odometer readings logged in the "Odometer" tab`)}
          </p>
        </div>
      )}

      <div className="rounded-2xl p-4 mb-6" style={{ background: C.surface, border: `1px solid ${C.border}` }}>
        <h3 className="font-ui font-bold text-sm mb-3" style={{ color: C.text }}>{tr("إضافة عملية صيانة", "Add a maintenance job")}</h3>
        <div className="grid grid-cols-2 md:grid-cols-6 gap-2">
          <select value={form.plate} onChange={e => setForm({ ...form, plate: e.target.value })}
            className="rounded-lg px-2 py-2 font-ui text-xs outline-none" style={{ background: C.surface2, border: `1px solid ${C.border}`, color: C.text }}>
            <option value="">{tr("المركبة", "Vehicle")}</option>
            {vehicles.map(v => <option key={v.plate} value={v.plate}>{v.plate}</option>)}
          </select>
          <select value={form.type} onChange={e => setForm({ ...form, type: e.target.value })}
            className="rounded-lg px-2 py-2 font-ui text-xs outline-none" style={{ background: C.surface2, border: `1px solid ${C.border}`, color: C.text }}>
            {TYPES.map(t => <option key={t} value={t}>{TYPE_LABELS[t][lang === "en" ? "en" : "ar"]}</option>)}
          </select>

function haversineKm(a, b) {
  const R = 6371;
  const dLat = (b.lat - a.lat) * Math.PI / 180;
  const dLng = (b.lng - a.lng) * Math.PI / 180;
  const la1 = a.lat * Math.PI / 180, la2 = b.lat * Math.PI / 180;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(la1) * Math.cos(la2) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

// Nearest-neighbor construction can leave "zigzag" crossings. 2-opt fixes those by
// repeatedly reversing segments whenever that shortens the total path, keeping the
// starting stop (index 0) fixed in place.
function twoOptImprove(points) {
  if (points.length < 4) return points;
  let route = [...points];
  let improved = true;
  let iterations = 0;
  while (improved && iterations < 300) {
    improved = false;
    iterations++;
    for (let i = 0; i < route.length - 2; i++) {
      for (let j = i + 2; j < route.length; j++) {
        const a = route[i], b = route[i + 1], c = route[j];
        const dNext = j + 1 < route.length ? route[j + 1] : null;
        const before = haversineKm(a, b) + (dNext ? haversineKm(c, dNext) : 0);
        const after = haversineKm(a, c) + (dNext ? haversineKm(b, dNext) : 0);
        if (after < before - 1e-6) {
          const seg = route.slice(i + 1, j + 1).reverse();
          route = [...route.slice(0, i + 1), ...seg, ...route.slice(j + 1)];
          improved = true;
        }
      }
    }
  }
  return route;
}

function RouteTab({ stops, setStops, customerLocations, customers, employees, vehicles, deliveries, setDeliveries, currentUser, lang }) {
  const tr = (ar, en) => (lang === "en" ? en : ar);
  const [q, setQ] = useState("");
  const [sorting, setSorting] = useState(false);
  const [podUid, setPodUid] = useState(null);
  const [podForm, setPodForm] = useState({ status: "", recipientName: "", notes: "", photo: null });
  const [savingPod, setSavingPod] = useState(false);
  const [repCode, setRepCode] = useState("");
  const [repName, setRepName] = useState("");
  const [tripPlate, setTripPlate] = useState("");
  const todayStr = new Date().toISOString().slice(0, 10);
  const [routeDate, setRouteDate] = useState("");

  const matches = useMemo(() => {
    if (!q.trim()) return [];
    const added = new Set(stops.map(s => s.uid));
    return customers
      .map(c => ({ ...c, uid: c.id }))
      .filter(c => !added.has(c.uid))
      .filter(c =>
        (c.name || "").toLowerCase().includes(q.toLowerCase()) ||
        String(c.code).toLowerCase().includes(q.toLowerCase()) ||
        (c.territory || "").toLowerCase().includes(q.toLowerCase())
      )
      .slice(0, 10);
  }, [q, stops, customers]);

  const territoryCount = new Set(stops.map(s => s.territory || tr("غير محدَّد", "Unspecified"))).size;
  const geoCount = stops.filter(s => customerLocations[s.uid]).length;

  function addStop(c) {
    setStops([...stops, c]);
    setQ("");
  }
  function removeStop(uid) {
    if (!confirm(tr("هل أنت متأكد من إزالة هذه النقطة من خط السير؟", "Are you sure you want to remove this stop from the route?"))) return;
    setStops(stops.filter(s => s.uid !== uid));
  }
  function moveStop(index, dir) {
    const next = [...stops];
    const j = index + dir;
    if (j < 0 || j >= next.length) return;
    [next[index], next[j]] = [next[j], next[index]];
    setStops(next);
  }
  function runSort(startPoint) {
    const withGeo = stops.filter(s => customerLocations[s.uid]);
    const withoutGeo = stops.filter(s => !customerLocations[s.uid]);

    let orderedGeo = [];
    if (withGeo.length > 0) {
      const remaining = withGeo.map(s => ({ ...s, ...customerLocations[s.uid] }));
      let current;
      if (startPoint) {
        // Start from whichever stop is nearest to the user's actual current location
        let bestIdx = 0, bestDist = Infinity;
        remaining.forEach((s, i) => {
          const d = haversineKm(startPoint, s);
          if (d < bestDist) { bestDist = d; bestIdx = i; }
        });
        current = remaining.splice(bestIdx, 1)[0];
      } else {
        current = remaining.shift();
      }
      orderedGeo.push(current);
      while (remaining.length) {
        let bestIdx = 0, bestDist = Infinity;
        remaining.forEach((s, i) => {
          const d = haversineKm(current, s);
          if (d < bestDist) { bestDist = d; bestIdx = i; }
        });
        current = remaining.splice(bestIdx, 1)[0];
        orderedGeo.push(current);
      }
      orderedGeo = twoOptImprove(orderedGeo);
    }
    const orderedText = [...withoutGeo].sort((a, b) => {
      const t = (a.territory || "").localeCompare(b.territory || "");
      if (t !== 0) return t;
      const g = (a.governorate || "").localeCompare(b.governorate || "");
      if (g !== 0) return g;
      return String(a.city || "").localeCompare(String(b.city || ""));
    });
    setStops([...orderedGeo, ...orderedText]);
  }
  function sortByLocation() {
    if (!navigator.geolocation) { runSort(null); return; }
    setSorting(true);
    navigator.geolocation.getCurrentPosition(
      (pos) => { runSort({ lat: pos.coords.latitude, lng: pos.coords.longitude }); setSorting(false); },
      () => {
        alert(tr("تعذّر تحديد موقعك الحالي (يجب السماح بالوصول إلى الموقع)؛ سيتم الترتيب حسب أقرب مسافة بين العملاء أنفسهم بدلًا من البدء من موقعك", "Couldn't get your current location (you need to allow location access) — ordering will be based on nearest distance between customers instead of starting from your location"));
        runSort(null);
        setSorting(false);
      },
      { enableHighAccuracy: true, timeout: 12000 }
    );
  }
  function clearRoute() {
    setStops([]);
  }

  function openPod(uid) {
    setPodUid(podUid === uid ? null : uid);
    setPodForm({ status: "", recipientName: "", notes: "", photo: null });
  }

    return (employees || []).find(emp => String(emp.code) === String(code).trim());

  function vehicleByPlate(plate) {
    return (vehicles || []).find(v => String(v.plate) === String(plate).trim());

    const match = repByCode(code);

    setRepName(match ? match.name : "");

  function handlePodPhoto(e) {

    compressImageForStorage(file).then(photo => setPodForm(prev => ({ ...prev, photo }))).catch(() => {});
  }
  function savePod(stop) {
    if (!podForm.status) {

    if (!repCode || !repName) {
      alert(tr("كود المندوب إلزامي — أدخله بجانب زر \"رتب حسب الموقع\" أعلاه قبل تسجيل أي عملية تسليم", "Rep code is required — enter it next to the \"Sort by location\" button above before recording any delivery"));
      return;
    }
    if (!tripPlate || !vehicleByPlate(tripPlate)) {
      alert(tr("رقم المركبة إلزامي وصحيح — أدخله بجانب كود المندوب أعلاه قبل تسجيل أي عملية تسليم", "A valid vehicle number is required — enter it next to the rep code above before recording any delivery"));
      return;
    }
    setSavingPod(true);
    const tripDate = routeDate || todayStr;
    const record = {
      id: Date.now(),
      customerUid: stop.uid,
      customerName: stop.name || "",
      customerCode: stop.code || "",
      status: podForm.status,
      repCode: repCode,
      repName: repName,
      plate: tripPlate,
      date: tripDate,
      recipientName: podForm.recipientName || "",
      notes: podForm.notes || "",
      photo: podForm.photo || null,
      deliveredAt: new Date().toISOString(),
      enteredBy: currentUser?.email || "",
    };
    setDeliveries([...(deliveries || []), record]);
    setSavingPod(false);
    setPodUid(null);
    setPodForm({ status: "", recipientName: "", notes: "", photo: null });
  }
  function lastDeliveryFor(uid) {
    const recs = (deliveries || []).filter(d => d.customerUid === uid);
    if (recs.length === 0) return null;
    return [...recs].sort((a, b) => (b.deliveredAt || "").localeCompare(a.deliveredAt || ""))[0];
  }

      <div className="rounded-2xl p-4 mb-6" style={{ background: C.surface, border: `1px solid ${repName ? C.border : C.red}` }}>
        <h3 className="font-ui font-bold text-sm mb-3" style={{ color: C.text }}>{tr("كود المندوب", "Rep code")}</h3>
        <input type="text" placeholder={tr("اكتب كود المندوب هنا *", "Enter rep code here *")}
          value={repCode} onChange={e => handleRepCodeChange(e.target.value)}
          className="w-full rounded-lg px-2 py-2 font-mono text-xs outline-none"
          style={{ background: C.surface2, border: `1px solid ${!repCode ? C.red + "66" : C.border}`, color: C.text }} />
        {repCode ? (
          <p className="font-ui text-[11px] mt-1.5" style={{ color: repName ? C.teal : C.red }}>
            {repName ? tr(`✓ المندوب: ${repName}`, `✓ Rep: ${repName}`) : tr("⚠ لا يوجد موظف بهذا الكود", "⚠ No employee with this code")}
          </p>
        ) : (
          <p className="font-ui text-[11px] mt-1.5" style={{ color: C.red }}>
            {tr("يجب إدخال كود المندوب الصحيح أولًا لاستخدام خط السير", "You must enter a valid rep code first to use the route")}
          </p>
        )}
        <h3 className="font-ui font-bold text-sm mb-3 mt-4" style={{ color: C.text }}>{tr("رقم المركبة", "Vehicle number")}</h3>
        <input type="text" placeholder={tr("اكتب رقم المركبة هنا *", "Enter vehicle number here *")}
          value={tripPlate} onChange={e => setTripPlate(e.target.value)}
          className="w-full rounded-lg px-2 py-2 font-mono text-xs outline-none"
          style={{ background: C.surface2, border: `1px solid ${!tripPlate ? C.red + "66" : C.border}`, color: C.text }} />
        {tripPlate ? (
          <p className="font-ui text-[11px] mt-1.5" style={{ color: vehicleByPlate(tripPlate) ? C.teal : C.red }}>
            {vehicleByPlate(tripPlate) ? tr("✓ مركبة مسجَّلة", "✓ Registered vehicle") : tr("⚠ لا توجد مركبة بهذا الرقم في الأسطول", "⚠ No vehicle with this number in the fleet")}
          </p>
        ) : (
          <p className="font-ui text-[11px] mt-1.5" style={{ color: C.red }}>
            {tr("يجب إدخال رقم مركبة صحيح لاستخدام خط السير", "You must enter a valid vehicle number to use the route")}

        <input type="date" value={routeDate} onChange={e => setRouteDate(e.target.value)} max={todayStr}
          className="w-full rounded-lg px-2 py-2 font-mono text-xs outline-none"
          style={{ background: C.surface2, border: `1px solid ${C.border}`, color: C.text }} />
        <p className="font-ui text-[11px] mt-1.5" style={{ color: C.muted }}>
          {tr(`اختياري — لو سبته فاضي هيتسجل بتاريخ اليوم (${todayStr}) تلقائيًا`, `Optional — leave empty to use today's date (${todayStr}) automatically`)}
        </p>
      </div>

      {!repName || !vehicleByPlate(tripPlate) ? (
        <EmptyState text={tr("خط السير مقفل حتى يتم إدخال كود مندوب صحيح ورقم مركبة صحيح أعلاه.", "The route is locked until you enter a valid rep code and vehicle number above.")} />
      ) : (
        <>
      <div className="flex flex-wrap gap-3 mb-6">
        <KpiCard icon={MapPin} value={stops.length} label={tr("عدد المحطات", "Number of stops")} color={C.teal} />
        <KpiCard icon={Navigation} value={geoCount} label={tr("محطات بموقع GPS دقيق", "Stops with precise GPS location")} color={C.teal} />
        <KpiCard icon={Building2} value={territoryCount} label={tr("عدد المناطق في الرحلة", "Number of territories in the trip")} color={C.amber} />
      </div>

      <div className="rounded-2xl p-4 mb-6" style={{ background: C.surface, border: `1px solid ${C.border}` }}>
        <h3 className="font-ui font-bold text-sm mb-3" style={{ color: C.text }}>{tr("إضافة عميل لخط السير", "Add a customer to the route")}</h3>
        <SearchBox value={q} onChange={setQ} placeholder={tr("ابحث بالاسم أو الكود أو المنطقة...", "Search by name, code, or territory...")} />
        {q.trim() !== "" && (
          <div className="space-y-2 -mt-2">
            {matches.length === 0 ? (
              <p className="font-ui text-xs" style={{ color: C.muted }}>{tr("لا توجد نتائج", "No results")}</p>

              <div key={c.uid} className="flex items-center gap-3 rounded-xl p-2.5" style={{ background: C.surface2, border: `1px solid ${C.border}` }}>

}

function parseOdometerText(text) {
  if (!text) return "";
  // Prefer a number explicitly near "km"/"كم" markers
  let m = text.match(/(?:km|كم)\D{0,5}(\d{3,7})/i);
  if (m) return m[1];
  // Otherwise take the longest standalone digit run (odometers are usually the biggest number on the dash)
  const nums = [...text.matchAll(/\d{3,7}/g)].map(x => x[0]);
  if (!nums.length) return "";
  return nums.sort((a, b) => b.length - a.length)[0];
}

    const matchesPlate = !plateFilter || l.plate === plateFilter;

    return matchesText && matchesPlate && matchesFrom && matchesTo;

  async function handlePhoto(e) {
    const file = e.target.files[0];
    if (!file) return;
    compressImageForStorage(file).then(setPhotoData).catch(() => {});

    setScanning(true);
    setScanNote("");
    try {
      const base64 = await fileToBase64(file);
      const text = await ocrReceipt(base64);

        setForm(prev => ({ ...prev, odometer }));

    if (!form.plate || !form.date || !form.odometer) return;
    const isDuplicate = logs.some(l =>
      l.plate === form.plate &&
      l.date === form.date &&
      String(l.odometer) === String(form.odometer)

    if (isDuplicate) {
      alert(tr("هذه البيانات مسجَّلة مسبقًا — نفس المركبة والتاريخ وقراءة العداد موجودة من قبل", "This entry already exists — same vehicle, date, and odometer reading were already recorded"));
      return;

    const platesLogs = logs.filter(l => l.plate === form.plate);
    if (platesLogs.length > 0) {

          `This reading (${form.odometer} km) is ${diff < 0 ? "lower than" : "very different from"} the last recorded reading for this vehicle (${lastOdo} km). This could be a typo or a scanning error. Save it anyway?`
