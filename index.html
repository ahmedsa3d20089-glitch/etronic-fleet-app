  { key: "reports", label: "التقارير" },
  { key: "deliveries", label: "تقارير التسليمات" },
  { key: "generalReports", label: "التقارير العامة" },
  { key: "vehicles", label: "الأسطول" },
  { key: "employees", label: "الموظفون" },
  { key: "customers", label: "العملاء" },
];

function AdminTab({ accounts, setAccounts, currentUser, auditLog, lang }) {
  const tr = (ar, en) => (lang === "en" ? en : ar);
  const ACTION_LABELS = {
    "إنشاء حساب": { ar: "إنشاء حساب", en: "Account created" },
    "تفعيل حساب": { ar: "تفعيل حساب", en: "Account activated" },
    "تعطيل حساب": { ar: "تعطيل حساب", en: "Account deactivated" },
    "حذف حساب": { ar: "حذف حساب", en: "Account deleted" },
    "تغيير صلاحيات": { ar: "تغيير صلاحيات", en: "Permissions changed" },
  };
  const [form, setForm] = useState({ name: "", email: "", password: "" });
  const [creating, setCreating] = useState(false);
  const [err, setErr] = useState("");

  const [pwForm, setPwForm] = useState({ current: "", next: "", confirm: "" });
  const [pwErr, setPwErr] = useState("");
  const [pwSuccess, setPwSuccess] = useState("");
  const [changingPw, setChangingPw] = useState(false);

  const [expandedEmail, setExpandedEmail] = useState(null);
  const [showLog, setShowLog] = useState(false);

  function createAccount() {
    if (!form.name || !form.email || !form.password) return;
    if (form.password.length < 6) { setErr(tr("يجب ألا تقل كلمة المرور عن 6 أحرف/أرقام", "Password must be at least 6 characters")); return; }
    // Arabic/RTL keyboards can silently insert invisible bidi-control characters
    // (e.g. U+200E/U+200F, U+202A-U+202E) around the typed email, which makes
    // Firebase reject it as "badly formatted" even though it looks correct on screen.
    const cleanEmail = form.email.replace(/[\u200B-\u200F\u202A-\u202E\u2066-\u2069\s]/g, "");
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(cleanEmail)) {
      setErr(tr("صيغة البريد الإلكتروني غير صحيحة — جرّب كتابته بلوحة مفاتيح إنجليزية بدلًا من العربية", "Invalid email format — try typing it with an English keyboard instead of Arabic"));
      return;
    }
    setErr(""); setCreating(true);
    secondaryAuth.createUserWithEmailAndPassword(cleanEmail, form.password)
      .then(() => {
        secondaryAuth.signOut();
        setAccounts([...accounts, { email: cleanEmail, name: form.name, role: "employee", active: true, permissions: [] }]);
        logAudit(currentUser, "إنشاء حساب", `${form.name} (${cleanEmail})`);
        setForm({ name: "", email: "", password: "" });
      })
      .catch(e => setErr(tr("تعذّر إنشاء الحساب: ", "Couldn't create the account: ") + e.message))
      .finally(() => setCreating(false));
  }
  function toggleActive(email) {
    const acc = accounts.find(a => a.email === email);
    setAccounts(accounts.map(a => a.email === email ? { ...a, active: !a.active } : a));
    logAudit(currentUser, acc && acc.active ? "تعطيل حساب" : "تفعيل حساب", email);
  }
  function deleteAccount(email, name) {
    if (!confirm(tr(`هل أنت متأكد من حذف حساب "${name}" نهائيًا؟ هذا الإجراء نهائي ولا يمكن التراجع عنه.`, `Are you sure you want to permanently delete "${name}"'s account? This cannot be undone.`))) return;
    setAccounts(accounts.filter(a => a.email !== email));
    logAudit(currentUser, "حذف حساب", `${name} (${email})`);
  }
  function togglePermission(email, key) {
    setAccounts(accounts.map(a => {
      if (a.email !== email) return a;
      const perms = a.permissions || [];
      const has = perms.includes(key);
      return { ...a, permissions: has ? perms.filter(p => p !== key) : [...perms, key] };
    }));
    logAudit(currentUser, "تغيير صلاحيات", `${email} — ${key}`);
  }
  async function changePassword() {
    if (!pwForm.current || !pwForm.next) return;
    if (pwForm.next.length < 6) { setPwErr(tr("يجب ألا تقل كلمة المرور الجديدة عن 6 أحرف", "New password must be at least 6 characters")); return; }
    if (pwForm.next !== pwForm.confirm) { setPwErr(tr("كلمة المرور الجديدة وتأكيدها غير متطابقين", "New password and confirmation don't match")); return; }
    setPwErr(""); setPwSuccess(""); setChangingPw(true);
    try {
      const cred = firebase.auth.EmailAuthProvider.credential(currentUser.email, pwForm.current);
      await auth.currentUser.reauthenticateWithCredential(cred);
      await auth.currentUser.updatePassword(pwForm.next);
      setPwSuccess(tr("تم تغيير كلمة المرور بنجاح", "Password changed successfully"));
      setPwForm({ current: "", next: "", confirm: "" });
    } catch (e) {
      setPwErr(tr("تعذّر تغيير كلمة المرور: ", "Couldn't change the password: ") + e.message);
    } finally {
      setChangingPw(false);
    }
  }

  return (
    <div>
      <h2 className="font-ui font-extrabold text-xl mb-4" style={{ color: C.text }}>{tr("إدارة الحسابات", "Account management")}</h2>

      <div className="rounded-2xl p-4 mb-5" style={{ background: C.surface, border: `1px solid ${C.border}` }}>
        <h3 className="font-ui font-bold text-sm mb-3" style={{ color: C.text }}>{tr("تغيير كلمة المرور لحسابي", "Change my password")}</h3>
        <div className="grid grid-cols-1 gap-2">
          <input type="password" placeholder={tr("كلمة المرور الحالية", "Current password")} value={pwForm.current} onChange={e => setPwForm({ ...pwForm, current: e.target.value })}
            className="rounded-lg px-2 py-2 font-mono text-xs outline-none" style={{ background: C.surface2, border: `1px solid ${C.border}`, color: C.text }} />
          <input type="password" placeholder={tr("كلمة المرور الجديدة (6 أحرف على الأقل)", "New password (at least 6 characters)")} value={pwForm.next} onChange={e => setPwForm({ ...pwForm, next: e.target.value })}
            className="rounded-lg px-2 py-2 font-mono text-xs outline-none" style={{ background: C.surface2, border: `1px solid ${C.border}`, color: C.text }} />
          <input type="password" placeholder={tr("تأكيد كلمة المرور الجديدة", "Confirm new password")} value={pwForm.confirm} onChange={e => setPwForm({ ...pwForm, confirm: e.target.value })}
            className="rounded-lg px-2 py-2 font-mono text-xs outline-none" style={{ background: C.surface2, border: `1px solid ${C.border}`, color: C.text }} />
        </div>
        {pwErr && <p className="font-ui text-xs mt-2" style={{ color: C.red }}>{pwErr}</p>}
        {pwSuccess && <p className="font-ui text-xs mt-2" style={{ color: C.teal }}>{pwSuccess}</p>}
        <button onClick={changePassword} disabled={changingPw} className="flex items-center gap-1.5 mt-3 px-3 py-2 rounded-lg font-ui text-xs font-semibold disabled:opacity-50"
          style={{ background: `${C.teal}22`, color: C.teal }}>
          {changingPw ? tr("جارٍ التغيير...", "Changing...") : tr("تغيير كلمة المرور", "Change password")}
        </button>
      </div>

      <div className="rounded-2xl p-4 mb-5" style={{ background: C.surface, border: `1px solid ${C.border}` }}>
        <h3 className="font-ui font-bold text-sm mb-3" style={{ color: C.text }}>{tr("إنشاء حساب موظف جديد", "Create a new employee account")}</h3>
        <div className="grid grid-cols-1 gap-2">
          <input placeholder={tr("اسم الموظف", "Employee name")} value={form.name} onChange={e => setForm({ ...form, name: e.target.value })}
            className="rounded-lg px-2 py-2 font-ui text-xs outline-none" style={{ background: C.surface2, border: `1px solid ${C.border}`, color: C.text }} />
          <input type="email" placeholder={tr("البريد الإلكتروني", "Email")} value={form.email} onChange={e => setForm({ ...form, email: e.target.value })}
            className="rounded-lg px-2 py-2 font-ui text-xs outline-none" style={{ background: C.surface2, border: `1px solid ${C.border}`, color: C.text }} />
          <input type="text" placeholder={tr("كلمة مرور مؤقتة (6 أحرف على الأقل)", "Temporary password (at least 6 characters)")} value={form.password} onChange={e => setForm({ ...form, password: e.target.value })}
            className="rounded-lg px-2 py-2 font-mono text-xs outline-none" style={{ background: C.surface2, border: `1px solid ${C.border}`, color: C.text }} />
        </div>
        {err && <p className="font-ui text-xs mt-2" style={{ color: C.red }}>{err}</p>}
        <button onClick={createAccount} disabled={creating} className="flex items-center gap-1.5 mt-3 px-3 py-2 rounded-lg font-ui text-xs font-semibold disabled:opacity-50"
          style={{ background: `${C.amber}22`, color: C.amber }}>
          <Plus size={14} /> {creating ? tr("جارٍ إنشاء الحساب...", "Creating account...") : tr("إنشاء حساب", "Create account")}
        </button>
      </div>

      <div className="space-y-2">
        {accounts.map(a => {
          const isSelf = a.email === currentUser.email;
          const isOtherAdmin = a.role === "admin";
          const expanded = expandedEmail === a.email;
          const perms = a.permissions || [];
          return (
            <div key={a.email} className="rounded-xl overflow-hidden" style={{ background: C.surface, border: `1px solid ${C.border}` }}>
              <div className="flex items-center gap-3 p-3">
                <div className="w-9 h-9 rounded-full flex items-center justify-center shrink-0" style={{ background: a.active ? `${C.teal}22` : `${C.red}18` }}>
                  <Users size={14} color={a.active ? C.teal : C.red} />
                </div>
                <div className="flex-1 min-w-0">
                  <p className="font-ui font-semibold text-sm truncate" style={{ color: C.text }}>{a.name} {a.role === "admin" ? tr("(المسؤول)", "(Admin)") : ""}</p>
                  <p className="font-ui text-xs truncate" style={{ color: C.muted }}>{a.email}</p>
                </div>
                {!isOtherAdmin && (
                  <button onClick={() => setExpandedEmail(expanded ? null : a.email)}
                    className="px-3 py-1.5 rounded-lg font-ui text-[11px] font-semibold shrink-0"
                    style={{ background: `${C.amber}22`, color: C.amber }}>
                    {expanded ? tr("قفل الصلاحيات", "Close permissions") : tr("الصلاحيات", "Permissions")}
                  </button>
                )}
                {!isSelf && (
                  <button onClick={() => toggleActive(a.email)}
                    className="px-3 py-1.5 rounded-lg font-ui text-[11px] font-semibold shrink-0"
                    style={{ background: a.active ? `${C.red}18` : `${C.teal}22`, color: a.active ? C.red : C.teal }}>
                    {a.active ? tr("إيقاف الحساب", "Deactivate account") : tr("تفعيل الحساب", "Activate account")}
                  </button>
                )}
                {!isSelf && !isOtherAdmin && (
                  <button onClick={() => deleteAccount(a.email, a.name)} className="p-1.5 rounded-lg shrink-0" style={{ background: `${C.red}18` }} title={tr("حذف الحساب نهائيًا", "Permanently delete account")}>
                    <Trash2 size={13} color={C.red} />
                  </button>
                )}
              </div>
              {expanded && !isOtherAdmin && (
                <div className="p-3 pt-0" style={{ borderTop: `1px solid ${C.border}` }}>
                  <p className="font-ui text-[11px] mb-2 mt-3" style={{ color: C.muted }}>{tr(`افتح تبويبات إضافية لـ ${a.name} (بخلاف التبويبات الأساسية المتاحة للجميع)`, `Grant ${a.name} access to extra tabs (beyond the base tabs available to everyone)`)}</p>
                  <div className="flex flex-wrap gap-2">
                    {PERMISSION_OPTIONS.map(opt => {
                      const on = perms.includes(opt.key);
                      return (
                        <button key={opt.key} onClick={() => togglePermission(a.email, opt.key)}
                          className="px-3 py-1.5 rounded-lg font-ui text-[11px] font-semibold"
                          style={{ background: on ? `${C.teal}22` : C.surface2, color: on ? C.teal : C.muted, border: `1px solid ${on ? C.teal : C.border}` }}>
                          {on ? "✓ " : ""}{(TAB_LABELS[opt.key] && TAB_LABELS[opt.key][lang === "en" ? "en" : "ar"]) || opt.label}
                        </button>
                      );
                    })}
                  </div>
                </div>
              )}
            </div>
          );
        })}
      </div>
      <p className="font-ui text-[11px] mt-3" style={{ color: C.muted }}>
        {tr('* "إيقاف الحساب" يمنع الموظف من الدخول إلى النظام فورًا وبشكل مؤقت، ويمكن إعادة تفعيله لاحقًا. "الحذف النهائي" يزيل الحساب نهائيًا من قائمة حسابات النظام بحيث لا يمكنه الدخول إطلاقًا — مع ملاحظة أن بيانات تسجيل الدخول (البريد الإلكتروني وكلمة المرور) تبقى محفوظة في Firebase دون حذف فعلي (يتطلب ذلك الوصول المباشر إلى إعدادات Firebase لحذفها بالكامل)؛ فإذا رغبت في منعه فعليًا من إنشاء حساب آخر بالبريد الإلكتروني نفسه، يلزم التواصل مع الدعم الفني لحذفه من Firebase Console أيضًا.',
          '* "Deactivate" immediately and temporarily blocks the employee from logging in, and can be reversed. "Permanent delete" removes the account from the system\'s account list entirely — note that the login credentials (email/password) remain in Firebase without being fully deleted (that requires direct access to Firebase settings), so if you want to fully prevent that email from being reused, contact me to delete it from the Firebase Console too.')}
      </p>
      <p className="font-ui text-[11px] mt-1" style={{ color: C.muted }}>{tr("* تمنح الصلاحيات المفتوحة المستخدم حق المشاهدة فقط لهذا التبويب، دون حق الإضافة أو الحذف.", "* Granted permissions give the user view access to that tab only, not the ability to add or delete.")}</p>

      <div className="rounded-2xl p-4 mt-5" style={{ background: C.surface, border: `1px solid ${C.border}` }}>
        <button onClick={() => setShowLog(!showLog)} className="flex items-center justify-between w-full">
          <h3 className="font-ui font-bold text-sm" style={{ color: C.text }}>{tr("سجل النشاط (آخر العمليات الحساسة)", "Activity log (most recent sensitive actions)")}</h3>
          <span className="font-ui text-xs" style={{ color: C.muted }}>{showLog ? tr("إخفاء ▲", "Hide ▲") : tr("إظهار ▼", "Show ▼")}</span>
        </button>
        {showLog && (
          (auditLog || []).length === 0 ? (
            <p className="font-ui text-xs mt-3" style={{ color: C.muted }}>{tr("لا توجد عمليات مسجَّلة بعد.", "No actions logged yet.")}</p>
          ) : (
            <div className="space-y-2 mt-3">
              {[...(auditLog || [])].sort((a, b) => (b.at || "").localeCompare(a.at || "")).slice(0, 50).map(entry => (
                <div key={entry.id} className="rounded-xl p-2.5" style={{ background: C.surface2 }}>

                    <span className="font-mono text-[10px]" style={{ color: C.muted }}>{(entry.at || "").replace("T", " ").slice(0, 16)}</span>
                  </div>
                  <p className="font-ui text-[11px] mt-1" style={{ color: C.muted }}>{entry.details} — {tr("بواسطة", "by")} {entry.by}</p>
                </div>
              ))}
            </div>
          )
        )}
      </div>
    </div>
  );
}

function AuthGate() {
  const [lang] = useLang();
  const [theme, setTheme] = useTheme();
  const tr = (ar, en) => (lang === "en" ? en : ar);
  const [user, setUser] = useState(undefined);
  const [accountStatus, setAccountStatus] = useState(undefined);
  const [errorMsg, setErrorMsg] = useState("");

  React.useEffect(() => {
    const unsub = auth.onAuthStateChanged(u => setUser(u));
    return unsub;
  }, []);

  React.useEffect(() => {
    if (!user) { setAccountStatus(undefined); return; }
    const colRef = db.collection("etronic_data_v2").doc("etronic_accounts").collection("items");
    const legacyRef = db.collection("etronic_data").doc("etronic_accounts");

    async function decide(snap) {
      if (!snap.empty) {
        const list = snap.docs.map(d => d.data());
        const mine = list.find(a => a.email === user.email);
        handleAccount(mine);
        return;
      }
      // الـ collection الجديدة فاضية — ممكن يكون فيه حسابات لسه في نظام
      // التخزين القديم ما اتهاجرتش، أو يكون ده أول مستخدم للنظام خالص.
      // منستخدمش نتيجة مخزنة (cache) في قرار إنشاء أول المسؤول — لازم قراءة
      // فعلية من السيرفر.
      try {
        const legacySnap = await legacyRef.get({ source: "server" });
        const legacyList = legacySnap.exists ? (legacySnap.data().value || []) : [];
        if (legacyList.length > 0) {
          const mine = legacyList.find(a => a.email === user.email);
          handleAccount(mine);
          return;
        }
        const serverColSnap = await colRef.get({ source: "server" });
        if (!serverColSnap.empty) {
          const list = serverColSnap.docs.map(d => d.data());
          const mine = list.find(a => a.email === user.email);
          handleAccount(mine);
          return;
        }
        const bootstrapped = { email: user.email, name: user.email, role: "admin", active: true };
        await colRef.doc(user.email).set(bootstrapped);
        setAccountStatus(bootstrapped);
      } catch (e) {
        setErrorMsg(tr("تعذّر التحقق من حسابك (مشكلة اتصال). حاول مرة أخرى.", "Couldn't verify your account (connection issue). Please try again."));
        auth.signOut();
      }
    }

    function handleAccount(mine) {
      if (!mine) {
        setErrorMsg(tr("هذا الحساب غير مسجَّل في النظام. يرجى التواصل مع المسؤول لإضافتك.", "This account isn't registered in the system. Ask the admin to add you."));
        auth.signOut();
        return;
      }
      if (!mine.active) {
        setErrorMsg(tr("حسابك موقوف حاليًا. يرجى التواصل مع المسؤول.", "Your account is currently deactivated. Contact the admin."));
        auth.signOut();
        return;
      }
      setAccountStatus(mine);
    }

    const unsub = colRef.onSnapshot(decide, () => {
      setErrorMsg(tr("تعذّر التحقق من حسابك (مشكلة اتصال). حاول مرة أخرى.", "Couldn't verify your account (connection issue). Please try again."));
    });
    return unsub;
  }, [user]);

  if (user === undefined || (user && accountStatus === undefined)) {
    return (
      <div dir="rtl" className="font-ui min-h-screen p-6" style={{ background: C.bg }}>
        <style>{FONTS}</style>
        <div className="max-w-md mx-auto mt-10">
          <SkeletonLoader rows={2} />
          <p className="font-ui text-xs text-center mt-4" style={{ color: C.muted }}>{tr("جارٍ التحقق من حسابك...", "Verifying your account...")}</p>
        </div>
      </div>
    );
  }
  if (!user) return <LoginScreen errorMsg={errorMsg} />;
  return <EtronicDashboard user={user} isAdmin={accountStatus.role === "admin"} permissions={accountStatus.permissions || []} theme={theme} setTheme={setTheme} />;
}

class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { error: null }; }
  static getDerivedStateFromError(error) { return { error }; }
  render() {
    if (this.state.error) {
      return (
        <div dir="rtl" style={{ background: "#12151B", color: "#E15D44", minHeight: "100vh", padding: 24, fontFamily: "monospace", fontSize: 13, whiteSpace: "pre-wrap" }}>
          حدث خطأ في التطبيق:
          {"\n\n"}{String((this.state.error && this.state.error.message) || this.state.error)}
        </div>
      );
    }
    return this.props.children;
  }
}

function FirebaseErrorScreen({ error }) {
  return (
    <div dir="rtl" style={{ background: "#12151B", color: "#E15D44", minHeight: "100vh", padding: 24, fontFamily: "monospace", fontSize: 13, whiteSpace: "pre-wrap" }}>
      تعذّر الاتصال بـ Firebase:
      {"\n\n"}{String((error && error.message) || error)}
      {"\n\n"}إذا كنت تفتح الملف مباشرة من جهازك (file://) جرّب فتحه من رابط الموقع المنشور بدلًا من ذلك.
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
if (firebaseInitError) {
  root.render(<FirebaseErrorScreen error={firebaseInitError} />);
} else {
  root.render(<ErrorBoundary><AuthGate /></ErrorBoundary>);
}

</script>

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }
</script>
